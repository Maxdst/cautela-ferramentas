                  <SignaturePad label={`Assinatura de ${devModal.lider_nome} — Confirmo a devolução`} onConfirm={devolver} onCancel={()=>setDevStep('form')} />
                </>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  )
}

// ─── EMPRÉSTIMOS ──────────────────────────────────────────────────────────────
function EmprestimosPage({ user, addToast }) {
  const [lista, setLista] = useState([])
  const [lideres, setLideres] = useState([])
  const [ferramentas, setFerramentas] = useState([])
  const [modal, setModal] = useState(null)
  const [form, setForm] = useState({})
  const [itens, setItens] = useState([])
  const [buscaEmail, setBuscaEmail] = useState('')
  const [tomadorEncontrado, setTomadorEncontrado] = useState(null)
  const [buscando, setBuscando] = useState(false)
  const [sigModal, setSigModal] = useState(null)
  const [filtro, setFiltro] = useState('')

  const load = () => GET('/emprestimos').then(setLista).catch(()=>{})
  useEffect(() => {
    load()
    GET('/ferramentas').then(setFerramentas)
    if (user.role === 'operario') GET('/usuarios/lideres').then(setLideres)
  }, [])

  const buscarTomador = async () => {
    if (!buscaEmail) return
    setBuscando(true); setTomadorEncontrado(null)
    try {
      const u = await GET(`/usuarios/buscar?email=${encodeURIComponent(buscaEmail)}`)
      if (!u) addToast('Nenhum operário encontrado com este email.', 'warning')
      setTomadorEncontrado(u)
    } catch(e) { addToast(e.message, 'error') }
    setBuscando(false)
  }

  const solicitar = async () => {
    if (!tomadorEncontrado) { addToast('Busque e confirme o tomador.', 'error'); return }
    if (!form.lider_id) { addToast('Selecione o líder responsável.', 'error'); return }
    if (!itens.length) { addToast('Adicione ao menos um item.', 'error'); return }
    try {
      const r = await POST('/emprestimos', { tomador_email: buscaEmail, lider_id: form.lider_id, itens, obs: form.obs || '' })
      addToast(`Solicitação enviada. ${r.tomador_nome} receberá notificação.`, 'success')
      setModal(null); setBuscaEmail(''); setTomadorEncontrado(null); setItens([]); setForm({}); load()
    } catch(e) { addToast(e.message, 'error') }
  }

  const confirmar = async id => {
    try { await POST(`/emprestimos/${id}/confirmar`, {}); addToast('Confirmado!', 'success'); load() }
    catch(e) { addToast(e.message, 'error') }
  }
  const recusar = async id => {
    if (!confirm('Recusar este empréstimo?')) return
    try { await POST(`/emprestimos/${id}/recusar`, {}); addToast('Recusado.', 'success'); load() }
    catch(e) { addToast(e.message, 'error') }
  }
  const devolver = async id => {
    if (!confirm('Confirmar devolução?')) return
    try { await POST(`/emprestimos/${id}/devolver`, {}); addToast('Devolução registrada!', 'success'); load() }
    catch(e) { addToast(e.message, 'error') }
  }

  const avalLider = async sig => {
    try {
      await POST(`/emprestimos/${sigModal.id}/aval-lider`, { assinatura: sig })
      addToast('Empréstimo aprovado e ativo!', 'success')
      setSigModal(null); load()
    } catch(e) { addToast(e.message, 'error') }
  }

  const filtrados = lista.filter(e => !filtro || e.status === filtro)

  return (
    <div>
      <div className="topbar">
        <h2>Empréstimos entre Operários</h2>
        {user.role === 'operario' && <button className="btn btn-accent" onClick={()=>setModal('novo')}><Icon name="plus" size={14}/> Solicitar Empréstimo</button>}
      </div>

      <div className="card">
        <div className="card-body" style={{paddingBottom:0}}>
          <select value={filtro} onChange={e=>setFiltro(e.target.value)} style={{width:'auto',marginBottom:16}}>
            <option value="">Todos</option>
            <option value="aguardando_tomador">Aguard. confirmação</option>
            <option value="aguardando_lider">Aguard. aval líder</option>
            <option value="ativo">Ativos</option>
            <option value="devolvido">Devolvidos</option>
            <option value="recusado">Recusados</option>
          </select>
        </div>
        <div className="table-wrap"><table className="cards-mobile">
          <thead><tr><th>Solicitante</th><th>Tomador</th><th>Líder</th><th>Itens</th><th>Status</th><th>Ações</th></tr></thead>
          <tbody>
            {filtrados.map(e=>(
              <tr key={e.id}>
                <td data-label="Solicitante">{e.solicitante_nome}</td>
                <td data-label="Tomador">{e.tomador_nome}</td>
                <td data-label="Líder">{e.lider_nome||'—'}</td>
                <td data-label="Itens" style={{fontSize:'.82rem'}}>{e.itens.map(i=>`${i.ferramenta_nome} (${i.quantidade}x)`).join(', ')}</td>
                <td data-label="Status"><span className={`badge badge-${e.status}`}>{STATUS_LABEL[e.status]}</span></td>
                <td className="cell-actions"><div className="actions">
                  {e.status === 'aguardando_tomador' && user.id === e.tomador_id && <>
                    <button className="btn btn-success btn-sm" onClick={()=>confirmar(e.id)} style={{display:'inline-flex',alignItems:'center',gap:5}}><Icon name="check" size={14}/> Confirmar</button>
                    <button className="btn btn-danger btn-sm" onClick={()=>recusar(e.id)} style={{display:'inline-flex',alignItems:'center',gap:5}}><Icon name="x" size={14}/> Recusar</button>
                  </>}
                  {e.status === 'aguardando_lider' && user.id === e.lider_id && (
                    <button className="btn btn-accent btn-sm" onClick={()=>setSigModal(e)} style={{display:'inline-flex',alignItems:'center',gap:5}}><Icon name="signature" size={14}/> Assinar aval</button>
                  )}
                  {e.status === 'ativo' && (user.id === e.solicitante_id || user.id === e.tomador_id) && (
                    <button className="btn btn-success btn-sm" onClick={()=>devolver(e.id)} style={{display:'inline-flex',alignItems:'center',gap:5}}><Icon name="download" size={14}/> Devolver</button>
                  )}
                </div></td>
              </tr>
            ))}
            {!filtrados.length && <tr><td colSpan="6"><div className="empty"><div className="empty-icon"><Icon name="handshake" size={32}/></div><p>{filtro ? 'Nenhum empréstimo com esse status.' : 'Nenhum empréstimo registrado.'}</p>{!filtro && user.role==='operario' && <button className="btn btn-accent empty-cta" onClick={()=>setModal('novo')}><Icon name="plus" size={14}/> Solicitar empréstimo</button>}</div></td></tr>}
          </tbody>
        </table></div>
      </div>

      {/* Modal novo empréstimo */}
      {modal === 'novo' && (
        <div className="modal-overlay open">
          <div className="modal modal-lg">
            <div className="modal-header"><h3>Solicitar Empréstimo</h3><button className="modal-close" onClick={()=>setModal(null)}>×</button></div>
            <div className="modal-body">
              <div className="alert alert-info">O colega precisará confirmar no próprio login, e o líder selecionado assinará o aval.</div>
              <div className="auth-device-box">
                <h4 style={{display:'flex',alignItems:'center',gap:8}}><Icon name="search" size={16}/> Buscar Operário pelo Email</h4>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                  <input type="email" value={buscaEmail} onChange={e=>{setBuscaEmail(e.target.value);setTomadorEncontrado(null)}} placeholder="email.exato@do.colega.com" style={{flex:1}} />
                  <button className="btn btn-primary" onClick={buscarTomador} disabled={buscando}>{buscando?'...':'Buscar'}</button>
                </div>
                {tomadorEncontrado && (
                  <div style={{background:'#d1fae5',padding:10,borderRadius:8,fontSize:'.88rem',display:'flex',alignItems:'center',gap:8}}>
                    <Icon name="checkCircle" size={15}/> Encontrado: <strong>{tomadorEncontrado.nome}</strong> — {tomadorEncontrado.cargo||ROLE_LABEL[tomadorEncontrado.role]}
                  </div>
                )}
                {buscaEmail && !tomadorEncontrado && !buscando && (
                  <div style={{background:'#fee2e2',padding:10,borderRadius:8,fontSize:'.88rem'}}>Nenhum operário encontrado com este email.</div>
                )}
              </div>
              <div className="form-group" style={{marginBottom:16}}>
                <label>Líder responsável *</label>
                <select value={form.lider_id||''} onChange={e=>setForm({...form,lider_id:e.target.value})}>
                  <option value="">Selecione o líder...</option>
                  {lideres.map(l=><option key={l.id} value={l.id}>{l.nome} — {l.cargo}</option>)}
                </select>
              </div>
              <label style={{display:'block',marginBottom:6}}>Ferramentas a emprestar *</label>
              <ItemsEditor ferramentas={ferramentas} value={itens} onChange={setItens} />
              <div className="form-group" style={{marginTop:12}}>
                <label>Observação</label>
                <textarea value={form.obs||''} onChange={e=>setForm({...form,obs:e.target.value})} placeholder="Motivo do empréstimo..." />
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setModal(null)}>Cancelar</button>
              <button className="btn btn-accent" onClick={solicitar} disabled={!tomadorEncontrado||!itens.length} style={{display:'inline-flex',alignItems:'center',gap:6}}><Icon name="send" size={14}/> Enviar solicitação</button>
            </div>
          </div>
        </div>
      )}

      {/* Modal aval líder */}
      {sigModal && (
        <div className="modal-overlay open">
          <div className="modal modal-md">
            <div className="modal-header"><h3>Aval do Líder</h3><button className="modal-close" onClick={()=>setSigModal(null)}>×</button></div>
            <div className="modal-body">
              <p style={{marginBottom:8}}><strong>De:</strong> {sigModal.solicitante_nome} → <strong>Para:</strong> {sigModal.tomador_nome}</p>
              <p style={{marginBottom:12}}>Itens: {sigModal.itens.map(i=>`${i.ferramenta_nome} (${i.quantidade}x)`).join(', ')}</p>
              <div className="alert alert-warning" style={{display:'flex',alignItems:'center',gap:8}}><Icon name="alertTriangle" size={16}/> Ambos os operários confirmaram. Ao assinar, você aprova este empréstimo.</div>
              <SignaturePad label={`Aval de ${user.nome}`} onConfirm={avalLider} onCancel={()=>setSigModal(null)} />
            </div>
          </div>
        </div>
      )}
    </div>
  )
}

// ─── LISTA EM ACORDEÃO (padrão reutilizável) ──────────────────────────────────
// Lista compacta: cada item mostra um resumo (título + info à direita). Tocar num
// item expande o painel de edição logo abaixo dele (entre os itens); tocar de novo
// fecha. Usado em Ferramentas, Usuários, etc. — o visual da lista/painel vive só
// aqui, então mudanças de design são feitas uma vez e valem para todas as telas.
function ListaAcordeao({ itens, keyOf, resumo, painel, novoAberto, painelNovo, abertoId, onToggle, vazio }) {
  if (!itens.length && !novoAberto) return vazio || null
  return (
    <div className="tool-list">
      {novoAberto && painelNovo}
      {itens.map(it => {
        const k = keyOf(it)
        const isOpen = abertoId === k
        const r = resumo(it)
        return (
          <React.Fragment key={k}>
            <button className={`tool-item ${isOpen?'open':''}`} onClick={()=>onToggle(it)}>
              <span className="ti-nome">{r.titulo}</span>
              <span className="ti-right">{r.direita}<span className="ti-chevron"><Icon name="chevronRight" size={18}/></span></span>
            </button>
            {isOpen && painel(it)}
          </React.Fragment>
        )
      })}
    </div>
  )
}

// Casca padrão do painel de edição do acordeão (cabeçalho + fechar + rodapé).
// A página passa os campos (children) e os botões do rodapé (footer).
function PainelEdicao({ titulo, onFechar, children, footer }) {
  return (
    <div className="tool-edit-panel">
      <div className="tep-head">
        <span className="tep-title">{titulo}</span>
        <button className="tep-close" onClick={onFechar} aria-label="Fechar"><Icon name="x" size={16}/></button>
      </div>
      {children}
      <div className="tep-footer">{footer}</div>
    </div>
  )
}

// ─── FERRAMENTAS ──────────────────────────────────────────────────────────────
function FerramentasPage({ user, addToast }) {
  const [lista, setLista] = useState([])
  const [openId, setOpenId] = useState(null)   // id da ferramenta aberta, 'new', ou null
  const [form, setForm] = useState({})
  const [busca, setBusca] = useState('')
  const [confirmDel, setConfirmDel] = useState(false)
  const isMaster = !!(user && user.is_master)
  const load = () => GET('/ferramentas').then(setLista)
  useEffect(() => { load() }, [])
  const abrirNovo = () => { setForm({quantidade_total:1}); setConfirmDel(false); setOpenId('new') }
  const toggle = f => {
    if (openId === f.id) { fechar(); return }
    setForm({...f}); setConfirmDel(false); setOpenId(f.id)
  }
  const fechar = () => { setOpenId(null); setConfirmDel(false) }
  const save = async () => {
    if (!form.nome) { addToast('Informe o nome.','error'); return }
    try {
      if (form.id) await PUT(`/ferramentas/${form.id}`, form)
      else await POST('/ferramentas', form)
      addToast(form.id ? 'Atualizada!' : 'Cadastrada!', 'success')
      fechar(); load()
    } catch(e) { addToast(e.message,'error') }
  }
  const del = async () => {
    try { await DEL(`/ferramentas/${form.id}`); addToast('Excluída!','success'); fechar(); load() }
    catch(e) { addToast(e.message,'error') }
  }
  const filtradas = lista.filter(f => !busca || f.nome.toLowerCase().includes(busca.toLowerCase()) || (f.codigo||'').toLowerCase().includes(busca.toLowerCase()))
  // Painel de edição/cadastro (usa a casca padrão PainelEdicao)
  const painel = () => {
    const temCodigo = !!(form.codigo && form.codigo.trim())
    const codigoLocked = !!(form.id && form.codigo && form.codigo.trim())
    const titulo = form.id ? (form.codigo ? `Patrimônio ${form.codigo}` : 'Editar ferramenta') : 'Nova ferramenta'
    const footer = confirmDel ? (
      <div style={{display:'flex',alignItems:'center',gap:10,width:'100%',justifyContent:'space-between',flexWrap:'wrap'}}>
        <span style={{fontSize:'.85rem',color:'var(--danger)',fontWeight:600,display:'inline-flex',alignItems:'center',gap:6}}><Icon name="alertTriangle" size={15}/> Excluir esta ferramenta?</span>
        <div className="gap-8"><button className="btn btn-ghost btn-sm" onClick={()=>setConfirmDel(false)}>Não</button><button className="btn btn-danger btn-sm" onClick={del}>Sim, excluir</button></div>
      </div>
    ) : (<>
      <div>{isMaster && form.id && !temCodigo && <button className="btn btn-danger btn-sm" onClick={()=>setConfirmDel(true)}><Icon name="trash" size={14}/> Excluir</button>}</div>
      <div className="gap-8">
        <button className="btn btn-ghost btn-sm" onClick={fechar}>Cancelar</button>
        <button className="btn btn-primary btn-sm" onClick={save}><Icon name="check" size={14}/> Salvar</button>
      </div>
    </>)
    return (
      <PainelEdicao titulo={titulo} onFechar={fechar} footer={footer}>
        <div className="form-grid">
          <div className="form-group full"><label>Nome *</label><input value={form.nome||''} onChange={e=>setForm({...form,nome:e.target.value})} /></div>
          <div className="form-group">
            <label>Código / Patrimônio</label>
            <input value={form.codigo||''} onChange={e=>!codigoLocked&&setForm({...form,codigo:e.target.value})} placeholder="FUR-001" disabled={codigoLocked} style={codigoLocked?{background:'#EEF1F5',cursor:'not-allowed'}:{}} />
            {codigoLocked && <span style={{fontSize:'.72rem',color:'var(--text-secondary)',marginTop:2,display:'inline-flex',alignItems:'center',gap:4}}><Icon name="lock" size={11}/> Código de patrimônio não pode ser alterado</span>}
          </div>
          <div className="form-group"><label>Categoria</label><input value={form.categoria||''} onChange={e=>setForm({...form,categoria:e.target.value})} /></div>
          <div className="form-group">
            <label>Quantidade total {temCodigo && <span style={{color:'var(--text-secondary)',fontWeight:400,fontSize:'.75rem'}}>(item único — fixo em 1)</span>}</label>
            <input type="number" min="0" value={temCodigo ? 1 : (form.quantidade_total??0)} onChange={e=>!temCodigo&&setForm({...form,quantidade_total:Math.max(0,parseInt(e.target.value)||0)})} disabled={temCodigo} style={temCodigo?{background:'#EEF1F5',cursor:'not-allowed'}:{}} />
            {form.id && form.quantidade_disponivel != null && <span style={{fontSize:'.72rem',marginTop:3,color:form.quantidade_disponivel<=0?'var(--danger)':'var(--text-secondary)',display:'inline-flex',alignItems:'center',gap:4}}><Icon name="package" size={11}/> {Math.max(0,form.quantidade_disponivel)} disponível agora · {form.quantidade_total-Math.max(0,form.quantidade_disponivel)} em uso</span>}
          </div>
          <div className="form-group full"><label>Valor unitário (R$)</label><input type="number" min="0" step="0.01" value={form.valor_unitario||''} onChange={e=>setForm({...form,valor_unitario:parseFloat(e.target.value)||0})} placeholder="0,00" /></div>
          <div className="form-group full"><label>Descrição</label><textarea value={form.descricao||''} onChange={e=>setForm({...form,descricao:e.target.value})} /></div>
        </div>
      </PainelEdicao>
    )
  }
  const vazio = <div className="empty"><div className="empty-icon"><Icon name="wrench" size={32}/></div><p>{busca ? 'Nenhuma ferramenta encontrada para essa busca.' : 'Nenhuma ferramenta cadastrada ainda.'}</p>{!busca && <button className="btn btn-accent empty-cta" onClick={abrirNovo}><Icon name="plus" size={14}/> Cadastrar ferramenta</button>}</div>
  return (
    <div style={{maxWidth:680,margin:'0 auto'}}>
      <div className="topbar"><h2>Ferramentas</h2><button className="btn btn-accent" onClick={abrirNovo}><Icon name="plus" size={14}/> Cadastrar</button></div>
      <div className="card">
        <div className="card-body" style={{paddingBottom:12}}>
          <input placeholder="Buscar por nome ou código..." value={busca} onChange={e=>setBusca(e.target.value)} />
        </div>
        <ListaAcordeao
          itens={filtradas} keyOf={f=>f.id} abertoId={openId} onToggle={toggle}
          novoAberto={openId==='new'} painelNovo={painel()} painel={()=>painel()} vazio={vazio}
          resumo={f=>{
            const disp = f.quantidade_disponivel != null ? f.quantidade_disponivel : f.quantidade_total
            const esgotado = disp <= 0
            return {
              titulo: <><span className="nm">{f.nome}</span>{f.codigo && <span title="Item patrimonial único" style={{color:'var(--text-secondary)',display:'inline-flex',flexShrink:0}}><Icon name="lock" size={12}/></span>}</>,
              direita: <span className="qtd-badge" title={`${Math.max(0,disp)} disponível de ${f.quantidade_total} no total`} style={esgotado?{color:'var(--danger)',borderColor:'var(--danger)'}:(disp!==f.quantidade_total?{color:'var(--warning)',borderColor:'var(--warning)'}:null)}>{Math.max(0,disp)}{disp!==f.quantidade_total && <span style={{color:'var(--text-secondary)',fontWeight:500}}> / {f.quantidade_total}</span>}</span>
            }
          }}
        />
      </div>
    </div>
  )
}

// Minha assinatura — o responsável registra a assinatura uma vez; ela é aplicada
// automaticamente ("lastreada") como assinatura do responsável nos termos de retirada.
function UniMinhaAssinatura({ user, addToast }) {
  const [assin, setAssin] = useState(null)
  const [editando, setEditando] = useState(false)
  const [loading, setLoading] = useState(true)
  useEffect(() => { GET('/perfil/assinatura').then(r => { setAssin(r.assinatura); setLoading(false) }).catch(() => setLoading(false)) }, [])
  const salvar = async sig => {
    try { await PUT('/perfil/assinatura', { assinatura: sig }); setAssin(sig); setEditando(false); addToast('Assinatura registrada!', 'success') }
    catch (e) { addToast(e.message, 'error') }
  }
  const remover = async () => {
    try { await PUT('/perfil/assinatura', { assinatura: null }); setAssin(null); setEditando(false); addToast('Assinatura removida.', 'success') }
    catch (e) { addToast(e.message, 'error') }
  }
  return (
    <div className="card"><div className="card-body">
      <p className="text-muted" style={{ fontSize: '.88rem', marginBottom: 16 }}>
        Registre sua assinatura uma vez. Ela será aplicada automaticamente como <strong>assinatura do responsável</strong> nos termos de retirada de uniforme/EPI gerados no seu login — sem precisar assinar cada documento. Em qualquer retirada você ainda pode optar por assinar diferente.
      </p>
      {loading ? <p className="text-muted">Carregando...</p> : (!editando && assin) ? (
        <div>
          <div style={{ border: '1px solid var(--border)', borderRadius: 8, padding: 16, background: '#fff', display: 'inline-block' }}>
            <img src={assin} alt="Minha assinatura" style={{ maxWidth: 300, maxHeight: 120, display: 'block' }} />
          </div>
          <div style={{ marginTop: 8, color: 'var(--success)', display: 'flex', alignItems: 'center', gap: 6, fontSize: '.85rem' }}><Icon name="checkCircle" size={15} /> Assinatura registrada para {user.nome}.</div>
          <div className="gap-8" style={{ marginTop: 14, display: 'flex', flexWrap: 'wrap' }}>
            <button className="btn btn-outline btn-sm" onClick={() => setEditando(true)}><Icon name="signature" size={14} /> Refazer</button>
            <button className="btn btn-danger btn-sm" onClick={remover}><Icon name="trash" size={14} /> Remover</button>
          </div>
        </div>
      ) : (
        <SignaturePad label={`Assine — ${user.nome}`} onConfirm={salvar} onCancel={assin ? () => setEditando(false) : undefined} />
      )}
    </div></div>
  )
}

// Estoque — catálogo de itens com edição em acordeão (mesmo padrão de Ferramentas).
function UniEstoque({ user, addToast }) {
  const [lista, setLista] = useState([])
  const [openId, setOpenId] = useState(null)
  const [form, setForm] = useState({})
  const [confirmDel, setConfirmDel] = useState(false)
  const isMaster = !!(user && user.is_master)
  const load = () => GET('/uniformes/itens').then(setLista)
  useEffect(() => { load() }, [])
  const abrirNovo = () => { setForm({ categoria: 'Uniforme', unidade: 'un', estoque_minimo: 0 }); setConfirmDel(false); setOpenId('new') }
  const toggle = it => { if (openId === it.id) { fechar(); return } setForm({ ...it, min_por_tamanho: parseMinTam(it.min_por_tamanho) }); setConfirmDel(false); setOpenId(it.id) }
  const fechar = () => { setOpenId(null); setConfirmDel(false) }
  const save = async () => {
    if (!form.nome) { addToast('Informe o nome.', 'error'); return }
    try {
      if (form.id) await PUT(`/uniformes/itens/${form.id}`, form)
      else await POST('/uniformes/itens', form)
      addToast(form.id ? 'Atualizado!' : 'Cadastrado!', 'success'); fechar(); load()
    } catch (e) { addToast(e.message, 'error') }
  }
  const del = async () => {
    try { await DEL(`/uniformes/itens/${form.id}`); addToast('Excluído!', 'success'); fechar(); load() }
    catch (e) { addToast(e.message, 'error') }
  }
  const painel = () => {
    const titulo = form.id ? `Editar ${form.nome}` : 'Novo item'
    const footer = confirmDel ? (
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%', justifyContent: 'space-between', flexWrap: 'wrap' }}>
        <span style={{ fontSize: '.85rem', color: 'var(--danger)', fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 6 }}><Icon name="alertTriangle" size={15} /> Excluir este item?</span>
        <div className="gap-8"><button className="btn btn-ghost btn-sm" onClick={() => setConfirmDel(false)}>Não</button><button className="btn btn-danger btn-sm" onClick={del}>Sim, excluir</button></div>
      </div>
    ) : (<>
      <div>{isMaster && form.id && <button className="btn btn-danger btn-sm" onClick={() => setConfirmDel(true)}><Icon name="trash" size={14} /> Excluir</button>}</div>
      <div className="gap-8"><button className="btn btn-ghost btn-sm" onClick={fechar}>Cancelar</button><button className="btn btn-primary btn-sm" onClick={save}><Icon name="check" size={14} /> Salvar</button></div>
    </>)
    return (
      <PainelEdicao titulo={titulo} onFechar={fechar} footer={footer}>
        <div className="form-grid">
          <div className="form-group full"><label>Nome *</label><input value={form.nome || ''} onChange={e => setForm({ ...form, nome: e.target.value })} /></div>
          <div className="form-group"><label>Categoria</label><select value={form.categoria || 'Uniforme'} onChange={e => setForm({ ...form, categoria: e.target.value })}><option>Uniforme</option><option>EPI</option></select></div>
          <div className="form-group"><label>Unidade</label><input value={form.unidade || 'un'} onChange={e => setForm({ ...form, unidade: e.target.value })} placeholder="un, par..." /></div>
          <div className="form-group"><label>Estoque mínimo (por tamanho)</label><input type="number" min="0" value={form.estoque_minimo ?? 0} onChange={e => setForm({ ...form, estoque_minimo: Math.max(0, parseInt(e.target.value) || 0) })} /></div>
          <div className="form-group"><label>Vida útil (meses)</label><input type="number" min="0" value={form.vida_util_meses ?? ''} onChange={e => setForm({ ...form, vida_util_meses: e.target.value === '' ? null : Math.max(0, parseInt(e.target.value) || 0) })} placeholder="sem prazo" /></div>
          <div className="form-group"><label>Custo de reposição (R$)</label><input type="number" min="0" step="0.01" value={form.custo_reposicao || ''} onChange={e => setForm({ ...form, custo_reposicao: parseFloat(e.target.value) || 0 })} placeholder="0,00" /></div>
          <div className="form-group full"><label>Tamanhos disponíveis</label><input value={form.tamanhos || ''} onChange={e => setForm({ ...form, tamanhos: e.target.value })} placeholder="P, M, G, GG  —  deixe vazio se for tamanho único" />
            <span style={{ fontSize: '.72rem', color: 'var(--text-secondary)', marginTop: 4, display: 'block' }}>Separe por vírgula. O estoque passa a ser controlado por tamanho.</span>
          </div>
          {gradeDe(form).length > 0 && (() => {
            const minObj = parseMinTam(form.min_por_tamanho)
            const setMinTam = (t, v) => { const o = { ...minObj }; if (v === '') delete o[t]; else o[t] = Math.max(0, parseInt(v) || 0); setForm({ ...form, min_por_tamanho: o }) }
            return (
              <div className="form-group full">
                <label>Mínimo por tamanho (opcional)</label>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 4 }}>
                  {gradeDe(form).map(t => (
                    <div key={t} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                      <span style={{ fontSize: '.78rem', minWidth: 26, color: 'var(--text-secondary)' }}>{t}</span>
                      <input type="number" min="0" value={minObj[t] ?? ''} placeholder={form.estoque_minimo ?? 0} onChange={e => setMinTam(t, e.target.value)} style={{ width: 64 }} />
                    </div>
                  ))}
                </div>
                <span style={{ fontSize: '.72rem', color: 'var(--text-secondary)', marginTop: 4, display: 'block' }}>Vazio = usa o mínimo geral acima ({form.estoque_minimo ?? 0}).</span>
              </div>
            )
          })()}
          {form.id && (
            <div className="form-group full">
              <span style={{ fontSize: '.75rem', color: 'var(--text-secondary)', display: 'inline-flex', alignItems: 'center', gap: 4, marginBottom: 6 }}><Icon name="package" size={12} /> {form.estoque_atual ?? 0} em estoque agora</span>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                {(form.estoque_por_tamanho || []).map(l => <TamChip key={l.tamanho} {...l} />)}
              </div>
            </div>
          )}
        </div>
      </PainelEdicao>
    )
  }
  const vazio = <div className="empty"><div className="empty-icon"><Icon name="shirt" size={32} /></div><p>Nenhum item cadastrado.</p><button className="btn btn-accent empty-cta" onClick={abrirNovo}><Icon name="plus" size={14} /> Cadastrar item</button></div>
  return (
    <div className="card">
      <div className="card-header"><span className="card-title">Itens em estoque</span><button className="btn btn-accent btn-sm" onClick={abrirNovo}><Icon name="plus" size={14} /> Novo item</button></div>
      <ListaAcordeao
        itens={lista} keyOf={i => i.id} abertoId={openId} onToggle={toggle}
        novoAberto={openId === 'new'} painelNovo={painel()} painel={() => painel()} vazio={vazio}
        resumo={i => {
          const algumBaixo = (i.estoque_por_tamanho || []).some(l => l.baixo)
          return {
            titulo: <>
              <div><span className="nm">{i.nome}</span> <span className="badge" style={{ background: i.categoria === 'EPI' ? '#fef3c7' : '#e0e7ff', color: i.categoria === 'EPI' ? '#92400e' : '#3730a3', fontSize: '.65rem' }}>{i.categoria}</span></div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, marginTop: 5 }}>{(i.estoque_por_tamanho || []).map(l => <TamChip key={l.tamanho} {...l} />)}</div>
            </>,
            direita: <span className="qtd-badge" title={`${i.estoque_atual} no total`} style={algumBaixo ? { color: 'var(--danger)', borderColor: 'var(--danger)', display: 'inline-flex', alignItems: 'center', gap: 4 } : null}>{i.estoque_atual}{algumBaixo && <Icon name="alertTriangle" size={12} />}</span>
          }
        }}
      />
    </div>
  )
}

// Entradas — manual + importação de XML de NF-e (revisão/mapeamento antes de gravar).
function UniEntradas({ addToast }) {
  const [itens, setItens] = useState([])
  const [entradas, setEntradas] = useState([])
  const [modo, setModo] = useState('manual')
  const [form, setForm] = useState({ item_id: '', quantidade: '', custo_unitario: '', fornecedor: '', tamanho: '' })
  const [nfe, setNfe] = useState(null)
  const load = () => { GET('/uniformes/itens').then(setItens); GET('/uniformes/entradas').then(setEntradas) }
  useEffect(() => { load() }, [])
  const itemSel = itens.find(i => String(i.id) === String(form.item_id))
  const gradeSel = gradeDe(itemSel)
  const salvarManual = async () => {
    if (!form.item_id || !form.quantidade) { addToast('Item e quantidade são obrigatórios.', 'error'); return }
    if (gradeSel.length && !form.tamanho) { addToast('Selecione o tamanho.', 'error'); return }
    try { await POST('/uniformes/entradas', form); addToast('Entrada registrada!', 'success'); setForm({ item_id: '', quantidade: '', custo_unitario: '', fornecedor: '', tamanho: '' }); load() }
    catch (e) { addToast(e.message, 'error') }
  }
  const lerXML = file => {
    const reader = new FileReader()
    reader.onload = async () => {
      try {
        const parsed = await POST('/uniformes/nfe/parse', { xml: reader.result })
        parsed._linhas = parsed.itens.map(l => ({ ...l, item_id: l.item_id_sugerido || '' }))
        setNfe(parsed)
        if (parsed.ja_importada) addToast('Atenção: esta NF-e já foi importada antes.', 'warning')
      } catch (e) { addToast(e.message, 'error') }
    }
    reader.readAsText(file)
  }
  const setLinha = (idx, patch) => setNfe(n => ({ ...n, _linhas: n._linhas.map((l, i) => i === idx ? { ...l, ...patch } : l) }))
  const gradeCat = id => gradeDe(nfe && nfe.catalogo.find(c => String(c.id) === String(id)))
  const confirmarNFe = async () => {
    const mapeadas = nfe._linhas.filter(l => l.item_id)
    if (!mapeadas.length) { addToast('Mapeie ao menos uma linha a um item do catálogo.', 'error'); return }
    if (mapeadas.some(l => gradeCat(l.item_id).length && !l.tamanho)) { addToast('Selecione o tamanho das linhas mapeadas a itens com grade.', 'error'); return }
    const linhas = mapeadas.map(l => ({ item_id: parseInt(l.item_id), quantidade: parseInt(l.quantidade) || 0, custo_unitario: l.custo_unitario || 0, tamanho: l.tamanho || '' }))
    try { const r = await POST('/uniformes/nfe/confirmar', { chave: nfe.chave, nfe_numero: nfe.nNF, fornecedor: nfe.fornecedor, linhas }); addToast(`${r.importadas} entrada(s) importada(s)!`, 'success'); setNfe(null); load() }
    catch (e) { addToast(e.message, 'error') }
  }
  return (
    <div>
      <div className="card">
        <div className="card-header"><span className="card-title">Dar entrada em estoque</span>
          <div className="uni-switch"><button className={modo === 'manual' ? 'active' : ''} onClick={() => setModo('manual')}>Manual</button><button className={modo === 'nfe' ? 'active' : ''} onClick={() => setModo('nfe')}>Importar NF-e</button></div>
        </div>
        <div className="card-body">
          {modo === 'manual' ? (
            <div className="form-grid">
              <div className="form-group full"><label>Item *</label><select value={form.item_id} onChange={e => setForm({ ...form, item_id: e.target.value, tamanho: '' })}><option value="">Selecione...</option>{itens.map(i => <option key={i.id} value={i.id}>{i.nome} ({i.estoque_atual} em estoque)</option>)}</select></div>
              {gradeSel.length > 0 && (
                <div className="form-group"><label>Tamanho *</label><select value={form.tamanho || ''} onChange={e => setForm({ ...form, tamanho: e.target.value })}><option value="">Selecione...</option>{gradeSel.map(t => <option key={t} value={t}>{t} ({dispDeTam(itemSel, t)} em estoque)</option>)}</select></div>
              )}
              <div className="form-group"><label>Quantidade *</label><input type="number" min="1" value={form.quantidade} onChange={e => setForm({ ...form, quantidade: e.target.value })} /></div>
              <div className="form-group"><label>Custo unitário (R$)</label><input type="number" min="0" step="0.01" value={form.custo_unitario} onChange={e => setForm({ ...form, custo_unitario: e.target.value })} placeholder="0,00" /></div>
              <div className="form-group full"><label>Fornecedor</label><input value={form.fornecedor} onChange={e => setForm({ ...form, fornecedor: e.target.value })} /></div>
              {itemSel && (itemSel.estoque_por_tamanho || []).length > 0 && (
                <div className="form-group full" style={{ display: 'flex', flexWrap: 'wrap', gap: 6, alignItems: 'center' }}>
                  <span style={{ fontSize: '.75rem', color: 'var(--text-secondary)' }}>Em estoque:</span>
                  {(itemSel.estoque_por_tamanho || []).map(l => <TamChip key={l.tamanho} {...l} />)}
                </div>
              )}
              <div className="form-group full"><button className="btn btn-primary" onClick={salvarManual}><Icon name="check" size={14} /> Registrar entrada</button></div>
            </div>
          ) : !nfe ? (
            <div>
              <p className="text-muted" style={{ marginBottom: 10, fontSize: '.85rem' }}>Envie o arquivo <strong>XML</strong> da NF-e (não o PDF/DANFE). Os itens são lidos e você confirma o mapeamento antes de dar entrada.</p>
              <input type="file" accept=".xml,text/xml,application/xml" onChange={e => e.target.files[0] && lerXML(e.target.files[0])} />
            </div>
          ) : (
            <div>
              <div className="alert" style={{ marginBottom: 12 }}>NF-e {nfe.nNF || '—'} · {nfe.fornecedor || 'fornecedor não identificado'}{nfe.ja_importada && <strong style={{ color: 'var(--danger)' }}> · JÁ IMPORTADA</strong>}</div>
              <div className="table-wrap"><table className="cards-mobile">
                <thead><tr><th>Produto (NF-e)</th><th>Qtd</th><th>Custo un.</th><th>Mapear para item</th><th>Tamanho</th></tr></thead>
                <tbody>
                  {nfe._linhas.map((l, idx) => {
                    const grade = gradeCat(l.item_id)
                    return (
                    <tr key={idx}>
                      <td data-label="Produto">{l.descricao}</td>
                      <td data-label="Qtd"><input type="number" min="0" value={l.quantidade} onChange={e => setLinha(idx, { quantidade: e.target.value })} style={{ width: 70 }} /></td>
                      <td data-label="Custo">{fmtBRL(l.custo_unitario)}</td>
                      <td data-label="Item"><select value={l.item_id} onChange={e => setLinha(idx, { item_id: e.target.value, tamanho: '' })}><option value="">— ignorar —</option>{nfe.catalogo.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}</select></td>
                      <td data-label="Tamanho">{!l.item_id ? <span className="text-muted">—</span> : grade.length ? (
                        <select value={l.tamanho || ''} onChange={e => setLinha(idx, { tamanho: e.target.value })}><option value="">Tam...</option>{grade.map(t => <option key={t} value={t}>{t}</option>)}</select>
                      ) : <span className="text-muted" title="Item de tamanho único">único</span>}</td>
                    </tr>
                  )})}
                </tbody>
              </table></div>
              <div className="gap-8" style={{ marginTop: 12, justifyContent: 'flex-end', display: 'flex' }}>
                <button className="btn btn-ghost btn-sm" onClick={() => setNfe(null)}>Cancelar</button>
                <button className="btn btn-primary btn-sm" onClick={confirmarNFe}><Icon name="check" size={14} /> Confirmar entrada</button>
              </div>
            </div>
          )}
        </div>
      </div>
      <div className="card">
        <div className="card-header"><span className="card-title">Entradas recentes</span></div>
        <div className="table-wrap"><table className="cards-mobile">
          <thead><tr><th>Data</th><th>Item</th><th>Tam.</th><th>Qtd</th><th>Origem</th><th>Fornecedor</th></tr></thead>
          <tbody>
            {entradas.map(en => (
              <tr key={en.id}>
                <td data-label="Data">{fmtDT(en.criado_em)}</td>
                <td data-label="Item"><strong>{en.item_nome}</strong></td>
                <td data-label="Tam.">{en.tamanho || '—'}</td>
                <td data-label="Qtd">+{en.quantidade}</td>
                <td data-label="Origem"><span className="badge" style={{ background: en.origem === 'nfe' ? '#dbeafe' : '#f0fdf4', color: en.origem === 'nfe' ? '#1e40af' : '#166534', fontSize: '.65rem' }}>{en.origem === 'nfe' ? 'NF-e' : 'Manual'}</span></td>
                <td data-label="Fornecedor" className="text-muted">{en.fornecedor || '—'}</td>
              </tr>
            ))}
            {!entradas.length && <tr><td colSpan="6" className="text-muted" style={{ textAlign: 'center', padding: 20 }}>Nenhuma entrada ainda.</td></tr>}
          </tbody>
        </table></div>
      </div>
    </div>
  )
}

// Colaboradores — cadastro com vínculo opcional a um login (habilita reautenticação).
function UniColaboradores({ addToast }) {
  const [lista, setLista] = useState([])
  const [vinculaveis, setVinculaveis] = useState([])
  const [openId, setOpenId] = useState(null)
  const [form, setForm] = useState({})
  const load = () => { GET('/uniformes/colaboradores').then(setLista); GET('/uniformes/usuarios-vinculaveis').then(setVinculaveis).catch(() => {}) }
  useEffect(() => { load() }, [])
  const abrirNovo = () => { setForm({}); setOpenId('new') }
  const toggle = c => { if (openId === c.id) { fechar(); return } setForm({ ...c }); setOpenId(c.id) }
  const fechar = () => setOpenId(null)
  const save = async () => {
    if (!form.nome) { addToast('Informe o nome.', 'error'); return }
    try { if (form.id) await PUT(`/uniformes/colaboradores/${form.id}`, form); else await POST('/uniformes/colaboradores', form); addToast(form.id ? 'Atualizado!' : 'Cadastrado!', 'success'); fechar(); load() }
    catch (e) { addToast(e.message, 'error') }
  }
  const painel = () => (
    <PainelEdicao titulo={form.id ? `Editar ${form.nome}` : 'Novo colaborador'} onFechar={fechar}
      footer={<><div /><div className="gap-8"><button className="btn btn-ghost btn-sm" onClick={fechar}>Cancelar</button><button className="btn btn-primary btn-sm" onClick={save}><Icon name="check" size={14} /> Salvar</button></div></>}>
      <div className="form-grid">
        <div className="form-group full"><label>Nome completo *</label><input value={form.nome || ''} onChange={e => setForm({ ...form, nome: e.target.value })} /></div>
        <div className="form-group"><label>Setor / Departamento</label><input value={form.setor || ''} onChange={e => setForm({ ...form, setor: e.target.value })} /></div>
        <div className="form-group"><label>CPF</label><input value={form.cpf || ''} onChange={e => setForm({ ...form, cpf: e.target.value })} /></div>
        <div className="form-group"><label>Data de admissão</label><input type="date" value={form.data_admissao || ''} onChange={e => setForm({ ...form, data_admissao: e.target.value })} /></div>
        <div className="form-group"><label>Vincular a login (opcional)</label><select value={form.usuario_id || ''} onChange={e => setForm({ ...form, usuario_id: e.target.value })}><option value="">Sem login vinculado</option>{vinculaveis.map(u => <option key={u.id} value={u.id}>{u.nome} — {u.email}</option>)}</select></div>
      </div>
      <p className="text-muted" style={{ fontSize: '.75rem', marginTop: 6 }}>Com login vinculado, a assinatura da retirada pode ser reautenticada por e-mail/senha do colaborador. Sem vínculo, ele assina no aparelho do responsável.</p>
    </PainelEdicao>
  )
  const vazio = <div className="empty"><div className="empty-icon"><Icon name="users" size={32} /></div><p>Nenhum colaborador cadastrado.</p><button className="btn btn-accent empty-cta" onClick={abrirNovo}><Icon name="plus" size={14} /> Cadastrar colaborador</button></div>
  return (
    <div className="card">
      <div className="card-header"><span className="card-title">Colaboradores</span><button className="btn btn-accent btn-sm" onClick={abrirNovo}><Icon name="plus" size={14} /> Novo</button></div>
      <ListaAcordeao itens={lista} keyOf={c => c.id} abertoId={openId} onToggle={toggle} novoAberto={openId === 'new'} painelNovo={painel()} painel={() => painel()} vazio={vazio}
        resumo={c => ({ titulo: <span className="nm">{c.nome}</span>, direita: <span className="text-muted" style={{ fontSize: '.8rem', display: 'inline-flex', alignItems: 'center', gap: 5 }}>{c.setor || '—'}{c.usuario_email && <span title="Login vinculado" style={{ display: 'inline-flex' }}><Icon name="key" size={12} /></span>}</span> })}
      />
    </div>
  )
}

// Retirada — colaborador + itens (por tamanho, com bloqueio de estoque), conferência do
// termo e as duas assinaturas (responsável pode usar a assinatura salva; colaborador ao vivo).
function UniRetirada({ user, addToast }) {
  const [colaboradores, setColaboradores] = useState([])
  const [itensCat, setItensCat] = useState([])
  const [entregas, setEntregas] = useState([])
  const [colId, setColId] = useState('')
  const [linhas, setLinhas] = useState([])
  const [step, setStep] = useState('form')            // form | termo | assinar
  const [termoHTML, setTermoHTML] = useState('')
  const [assinaturas, setAssinaturas] = useState({ colab: null, almox: null })
  const [minhaAssin, setMinhaAssin] = useState(null)  // assinatura salva do responsável
  const [assinarDiferente, setAssinarDiferente] = useState(false)
  const [reauth, setReauth] = useState({ email: '', senha: '' })
  const load = () => { GET('/uniformes/colaboradores').then(setColaboradores); GET('/uniformes/itens').then(setItensCat); GET('/uniformes/entregas').then(setEntregas) }
  useEffect(() => { load(); GET('/perfil/assinatura').then(r => setMinhaAssin(r.assinatura)).catch(() => {}) }, [])
  const colaborador = colaboradores.find(c => String(c.id) === String(colId))
  const addLinha = () => setLinhas([...linhas, { item_id: '', quantidade: 1, tamanho: '', observacao: '' }])
  const setLinha = (i, patch) => setLinhas(linhas.map((l, idx) => idx === i ? { ...l, ...patch } : l))
  const rmLinha = i => setLinhas(linhas.filter((_, idx) => idx !== i))

  // Estado calculado de uma linha (item + tamanho + disponibilidade).
  const infoLinha = l => {
    const it = itensCat.find(x => String(x.id) === String(l.item_id))
    if (!it) return { it: null }
    const grade = gradeDe(it), precisaTam = grade.length > 0, tamOk = !precisaTam || !!l.tamanho
    const disp = !tamOk ? null : dispDeTam(it, precisaTam ? l.tamanho : SEM_TAM_UI)
    const qtd = parseInt(l.quantidade) || 0
    const semEstoque = tamOk && disp != null && disp <= 0
    const excede = tamOk && disp != null && qtd > disp
    return { it, grade, precisaTam, tamOk, disp, qtd, semEstoque, excede }
  }
  const indisponiveis = linhas.filter(l => { const info = infoLinha(l); return info.it && (info.semEstoque || info.excede) })
  const removerIndisponiveis = () => setLinhas(linhas.filter(l => { const info = infoLinha(l); return !(info.it && (info.semEstoque || info.excede)) }))
  const setTamanho = (i, tamanho) => {
    const it = itensCat.find(x => String(x.id) === String(linhas[i].item_id))
    const disp = it ? dispDeTam(it, tamanho) : 0
    const q = Math.min(Math.max(1, parseInt(linhas[i].quantidade) || 1), Math.max(1, disp))
    setLinha(i, { tamanho, quantidade: q })
  }
  const setQtd = (i, v) => {
    const info = infoLinha(linhas[i])
    let q = parseInt(v) || ''
    if (q !== '' && info.disp != null) q = Math.min(Math.max(1, q), Math.max(1, info.disp))
    setLinha(i, { quantidade: q })
  }

  const irRevisar = async () => {
    if (!colId) { addToast('Selecione o colaborador.', 'error'); return }
    const validas = linhas.filter(l => l.item_id)
    if (!validas.length) { addToast('Adicione ao menos um item.', 'error'); return }
    for (const l of validas) {
      const info = infoLinha(l)
      if (info.precisaTam && !info.tamOk) { addToast(`Selecione o tamanho de ${info.it.nome}.`, 'error'); return }
      if (info.semEstoque) { addToast(`${info.it.nome}${l.tamanho ? ' tam. ' + l.tamanho : ''} sem estoque — remova a linha.`, 'error'); return }
      if (info.qtd <= 0) { addToast(`Quantidade inválida para ${info.it.nome}.`, 'error'); return }
      if (info.excede) { addToast(`Quantidade acima do disponível para ${info.it.nome}.`, 'error'); return }
    }
    const itens = validas.map(l => ({ item_id: parseInt(l.item_id), quantidade: parseInt(l.quantidade) || 1, tamanho: l.tamanho || undefined, observacao: l.observacao }))
    try { const r = await POST('/uniformes/entregas/previa-termo', { colaborador_id: parseInt(colId), itens }); setTermoHTML(r.html); setStep('termo') }
    catch (e) { addToast(e.message, 'error') }
  }
  const verTermo = async id => { const t = await GET(`/uniformes/entregas/${id}/termo`); const w = window.open('', '_blank', 'width=900,height=700,scrollbars=yes'); w.document.write(t.html); w.document.close() }

  const usaSalva = !!minhaAssin && !assinarDiferente
  const temResp = usaSalva || !!assinaturas.almox
  const resetTudo = () => { setColId(''); setLinhas([]); setAssinaturas({ colab: null, almox: null }); setReauth({ email: '', senha: '' }); setAssinarDiferente(false); setTermoHTML(''); setStep('form') }
  const finalizar = async () => {
    if (!temResp) { addToast('Falta a assinatura do responsável.', 'error'); return }
    if (!assinaturas.colab) { addToast('Falta a assinatura do colaborador.', 'error'); return }
    const itens = linhas.filter(l => l.item_id).map(l => ({ item_id: parseInt(l.item_id), quantidade: parseInt(l.quantidade) || 1, tamanho: l.tamanho || undefined, observacao: l.observacao }))
    try {
      const r = await POST('/uniformes/entregas', { colaborador_id: parseInt(colId), itens, assinatura_colaborador: assinaturas.colab, assinatura_almoxarife: assinaturas.almox || undefined, email: reauth.email || undefined, senha: reauth.senha || undefined })
      addToast('Retirada registrada!', 'success')
      await verTermo(r.id)
      resetTudo(); load()
    } catch (e) { addToast(e.message, 'error') }
  }
  return (
    <div>
      {step === 'form' && (
        <div className="card"><div className="card-body">
          <div className="form-group"><label>Colaborador *</label>
            <select value={colId} onChange={e => setColId(e.target.value)}><option value="">Selecione...</option>{colaboradores.map(c => <option key={c.id} value={c.id}>{c.nome}{c.setor ? ` — ${c.setor}` : ''}</option>)}</select>
          </div>
          <div style={{ margin: '16px 0 8px', fontWeight: 600, fontSize: '.85rem' }}>Itens a entregar</div>
          {linhas.map((l, i) => {
            const info = infoLinha(l)
            return (
              <div key={i} style={{ marginBottom: 8 }}>
                <div className="uni-linha">
                  <select value={l.item_id} onChange={e => setLinha(i, { item_id: e.target.value, tamanho: '', quantidade: 1 })}><option value="">Item...</option>{itensCat.map(it => <option key={it.id} value={it.id}>{it.nome} ({it.estoque_atual})</option>)}</select>
                  {info.it && info.precisaTam && (
                    <select value={l.tamanho || ''} onChange={e => setTamanho(i, e.target.value)} style={{ width: 120 }}>
                      <option value="">Tam...</option>
                      {info.grade.map(t => { const d = dispDeTam(info.it, t); return <option key={t} value={t} disabled={d <= 0}>{t} — {d} disp.{d <= 0 ? ' (esgotado)' : ''}</option> })}
                    </select>
                  )}
                  <input type="number" min="1" value={l.quantidade} onChange={e => setQtd(i, e.target.value)} style={{ width: 60 }} title="Quantidade" disabled={info.it && !info.tamOk} />
                  <input className="obs" value={l.observacao} onChange={e => setLinha(i, { observacao: e.target.value })} placeholder="Obs." />
                  <button className="btn btn-ghost btn-sm" onClick={() => rmLinha(i)}><Icon name="x" size={14} /></button>
                </div>
                {info.it && (
                  <div style={{ fontSize: '.72rem', marginTop: 3, marginLeft: 2, color: info.semEstoque || info.excede ? 'var(--danger)' : 'var(--text-secondary)', display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                    {!info.tamOk ? <><Icon name="alertTriangle" size={12} /> selecione o tamanho</>
                      : info.semEstoque ? <><Icon name="alertTriangle" size={12} /> sem estoque neste tamanho</>
                      : info.excede ? <><Icon name="alertTriangle" size={12} /> só há {info.disp} disponível(is)</>
                      : <>{info.disp} disponível(is){info.precisaTam ? ` no tam. ${l.tamanho}` : ''}</>}
                  </div>
                )}
              </div>
            )
          })}
          {indisponiveis.length > 0 && (
            <div className="alert" style={{ marginTop: 8, marginBottom: 8, fontSize: '.82rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, flexWrap: 'wrap', borderColor: 'var(--danger)' }}>
              <span style={{ color: 'var(--danger)', display: 'inline-flex', alignItems: 'center', gap: 6 }}><Icon name="alertTriangle" size={15} /> {indisponiveis.length} item(ns) sem estoque suficiente.</span>
              <button className="btn btn-danger btn-sm" onClick={removerIndisponiveis}>Remover indisponíveis</button>
            </div>
          )}
          <div><button className="btn btn-outline btn-sm" onClick={addLinha}><Icon name="plus" size={14} /> Adicionar item</button></div>
          <div style={{ marginTop: 16, textAlign: 'right' }}><button className="btn btn-primary" onClick={irRevisar} disabled={indisponiveis.length > 0}><Icon name="fileText" size={15} /> Revisar termo →</button></div>
        </div></div>
      )}

      {step === 'termo' && (
        <div className="card"><div className="card-body">
          <h3 style={{ marginBottom: 6 }}>Confira o termo antes de assinar</h3>
          <p className="text-muted" style={{ fontSize: '.82rem', marginBottom: 12 }}>Verifique itens, tamanhos e quantidades. Ninguém assina sem conferir o que está assinando.</p>
          <iframe title="Prévia do termo" srcDoc={termoHTML} style={{ width: '100%', height: '55vh', border: '1px solid var(--border)', borderRadius: 8, background: '#fff' }} />
          <div className="gap-8" style={{ marginTop: 16, justifyContent: 'space-between', display: 'flex', flexWrap: 'wrap' }}>
            <button className="btn btn-ghost" onClick={() => setStep('form')}>← Voltar e editar</button>
            <button className="btn btn-primary" onClick={() => setStep('assinar')}><Icon name="signature" size={15} /> Conferi — ir para assinatura</button>
          </div>
        </div></div>
      )}

      {step === 'assinar' && (
        <div className="card"><div className="card-body">
          <h3 style={{ marginBottom: 12 }}>Assinaturas — {colaborador && colaborador.nome}</h3>

          {/* Assinatura do responsável: salva ("lastreada") ou desenhada na hora */}
          {!temResp && !minhaAssin && (
            <div className="alert" style={{ marginBottom: 12, fontSize: '.82rem' }}>Você ainda não tem assinatura registrada. Assine abaixo — ou registre a sua em <strong>Minha assinatura</strong> para não repetir a cada retirada.</div>
          )}
          {usaSalva ? (
            <div style={{ border: '1px solid var(--border)', borderRadius: 8, padding: 12, marginBottom: 14, display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
              <img src={minhaAssin} alt="Assinatura" style={{ maxWidth: 160, maxHeight: 60, background: '#fff', border: '1px solid var(--border)', borderRadius: 4 }} />
              <div style={{ flex: 1, minWidth: 160 }}>
                <div style={{ color: 'var(--success)', display: 'inline-flex', alignItems: 'center', gap: 6, fontWeight: 600 }}><Icon name="checkCircle" size={16} /> Assinatura do responsável registrada</div>
                <div className="text-muted" style={{ fontSize: '.78rem' }}>Será aplicada automaticamente ({user.nome}).</div>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={() => { setAssinarDiferente(true); setAssinaturas(a => ({ ...a, almox: null })) }}>Assinar diferente</button>
            </div>
          ) : !assinaturas.almox ? (
            <div style={{ marginBottom: 8 }}>
              <SignaturePad label={`Assinatura do responsável — ${user.nome}`} onConfirm={sig => setAssinaturas(a => ({ ...a, almox: sig }))} onCancel={() => setStep('termo')} />
              {minhaAssin && <div style={{ textAlign: 'center', marginTop: 6 }}><button className="btn btn-ghost btn-sm" onClick={() => { setAssinarDiferente(false); setAssinaturas(a => ({ ...a, almox: null })) }}>Usar minha assinatura registrada</button></div>}
            </div>
          ) : null}

          {/* Assinatura do colaborador: sempre ao vivo (confere e assina presencialmente) */}
          {temResp && !assinaturas.colab && colaborador && colaborador.usuario_id && (
            <>
              <div className="alert" style={{ marginBottom: 12, fontSize: '.82rem' }}>Este colaborador tem login. Opcionalmente, informe e-mail/senha dele para reautenticar a assinatura.</div>
              <div className="form-grid" style={{ marginBottom: 12 }}>
                <div className="form-group"><label>E-mail (opcional)</label><input value={reauth.email} onChange={e => setReauth({ ...reauth, email: e.target.value })} /></div>
                <div className="form-group"><label>Senha (opcional)</label><input type="password" value={reauth.senha} onChange={e => setReauth({ ...reauth, senha: e.target.value })} /></div>
              </div>
            </>
          )}
          {temResp && !assinaturas.colab && (
            <SignaturePad label={`Assinatura do colaborador — ${colaborador && colaborador.nome}`} onConfirm={sig => setAssinaturas(a => ({ ...a, colab: sig }))} onCancel={() => setStep('termo')} />
          )}
          {temResp && assinaturas.colab && (
            <div style={{ textAlign: 'center', padding: '12px 0' }}>
              <p style={{ color: 'var(--success)', marginBottom: 14, display: 'inline-flex', alignItems: 'center', gap: 6 }}><Icon name="checkCircle" size={16} /> Assinaturas prontas.</p>
              <div className="gap-8" style={{ justifyContent: 'center', display: 'flex', flexWrap: 'wrap' }}>
                <button className="btn btn-ghost" onClick={() => { setAssinaturas(a => ({ ...a, colab: null })) }}>Refazer assinatura</button>
                <button className="btn btn-primary" onClick={finalizar}><Icon name="fileText" size={15} /> Finalizar e gerar termo</button>
              </div>
            </div>
          )}
        </div></div>
      )}

      <div className="card">
        <div className="card-header"><span className="card-title">Retiradas recentes</span></div>
        <div className="table-wrap"><table className="cards-mobile">
          <thead><tr><th>Nº</th><th>Colaborador</th><th>Data</th><th>Itens</th><th>Termo</th></tr></thead>
          <tbody>
            {entregas.map(e => (
              <tr key={e.id}>
                <td data-label="Nº"><strong>{e.numero}</strong></td>
                <td data-label="Colaborador">{e.colaborador_nome}</td>
                <td data-label="Data">{fmt(e.data_retirada || e.criado_em)}</td>
                <td data-label="Itens">{(e.itens || []).reduce((s, i) => s + i.quantidade, 0)} un</td>
                <td data-label="Termo" className="cell-actions"><button className="btn btn-outline btn-sm" onClick={() => verTermo(e.id)}><Icon name="fileText" size={14} /> Ver termo</button></td>
              </tr>
            ))}
            {!entregas.length && <tr><td colSpan="5" className="text-muted" style={{ textAlign: 'center', padding: 20 }}>Nenhuma retirada ainda.</td></tr>}
          </tbody>
        </table></div>
      </div>
    </div>
  )
}

            ))}
            {!dados.desgaste.length && <tr><td colSpan="4" className="text-muted" style={{ textAlign: 'center', padding: 20 }}>Nenhuma reposição próxima.</td></tr>}
          </tbody>
        </table></div>

  )

// ─── BOLSAS ───────────────────────────────────────────────────────────────────
function BolsasPage({ addToast }) {
  const [lista, setLista] = useState([])
  const [ferramentas, setFerramentas] = useState([])
  const [modal, setModal] = useState(null)
  const [form, setForm] = useState({})
  const [itens, setItens] = useState([])
  const load = () => { GET('/bolsas').then(setLista); GET('/ferramentas').then(setFerramentas) }
  useEffect(() => { load() }, [])
  const save = async () => {
    if (!form.nome) { addToast('Informe o nome.','error'); return }
    try {
      if (form.id) await PUT(`/bolsas/${form.id}`, {...form, itens})
      else await POST('/bolsas', {...form, itens})
      addToast(form.id?'Atualizada!':'Criada!','success'); setModal(null); load()
    } catch(e) { addToast(e.message,'error') }
  }
  return (
    <div>
      <div className="topbar"><h2>Bolsas / Kits</h2><button className="btn btn-accent" onClick={()=>{setForm({});setItens([]);setModal('form')}}><Icon name="plus" size={14}/> Nova Bolsa</button></div>
      <div className="card"><div className="table-wrap"><table className="cards-mobile">
        <thead><tr><th>Nome</th><th>Descrição</th><th>Itens</th><th>Valor</th><th>Ações</th></tr></thead>
        <tbody>
          {lista.map(b=>(
            <tr key={b.id}>
              <td data-label="Nome"><strong>{b.nome}</strong></td>
              <td data-label="Descrição" className="text-muted">{b.descricao||'—'}</td>
              <td data-label="Itens">{b.itens.length} tipo(s)</td>
              <td data-label="Valor" style={{color:'var(--success)',fontWeight:600}}>{fmtBRL(b.valor_total||0)}</td>
              <td className="cell-actions"><button className="btn btn-ghost btn-sm" onClick={()=>{setForm({...b});setItens(b.itens.map(i=>({ferramenta_id:i.ferramenta_id,quantidade:i.quantidade,ferramenta_nome:i.ferramenta_nome,valor_unitario:i.valor_unitario||0})));setModal('form')}} style={{display:'inline-flex',alignItems:'center',gap:5}}><Icon name="edit" size={14}/> Editar</button></td>
            </tr>
          ))}
          {!lista.length && <tr><td colSpan="5"><div className="empty"><div className="empty-icon"><Icon name="backpack" size={32}/></div><p>Nenhuma bolsa ou kit cadastrado.</p><button className="btn btn-accent empty-cta" onClick={()=>{setForm({});setItens([]);setModal('form')}}><Icon name="plus" size={14}/> Nova bolsa</button></div></td></tr>}
        </tbody>
      </table></div></div>
      {modal === 'form' && (
        <div className="modal-overlay open">
          <div className="modal modal-lg">
            <div className="modal-header"><h3>{form.id?'Editar':'Nova'} Bolsa</h3><button className="modal-close" onClick={()=>setModal(null)}>×</button></div>
            <div className="modal-body">
              <div className="form-grid" style={{marginBottom:16}}>
                <div className="form-group"><label>Nome *</label><input value={form.nome||''} onChange={e=>setForm({...form,nome:e.target.value})} /></div>
                <div className="form-group"><label>Descrição</label><input value={form.descricao||''} onChange={e=>setForm({...form,descricao:e.target.value})} /></div>
              </div>
              <label style={{display:'block',marginBottom:6}}>Ferramentas</label>
              <ItemsEditor ferramentas={ferramentas} value={itens} onChange={setItens} />
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setModal(null)}>Cancelar</button>
              <button className="btn btn-primary" onClick={save}>Salvar</button>
