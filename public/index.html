      )}
    </div>
  )
}

// ─── USUÁRIOS ─────────────────────────────────────────────────────────────────
// ─── OBRAS / CANTEIROS ────────────────────────────────────────────────────────
function ObrasPage({ addToast }) {
  const [lista, setLista] = useState([])
  const [lideres, setLideres] = useState([])
  const [openId, setOpenId] = useState(null)
  const [form, setForm] = useState({})
  const [confirmDel, setConfirmDel] = useState(false)
  const load = () => GET('/obras?all=1').then(setLista).catch(()=>{})
  useEffect(() => { load(); GET('/usuarios/lideres').then(setLideres).catch(()=>{}) }, [])
  const abrirNovo = () => { setForm({ativo:true}); setConfirmDel(false); setOpenId('new') }
  const toggle = o => { if (openId === o.id) { fechar(); return } setForm({...o}); setConfirmDel(false); setOpenId(o.id) }
  const fechar = () => { setOpenId(null); setConfirmDel(false) }
  const save = async () => {
    if (!form.nome || !form.nome.trim()) { addToast('Nome da obra é obrigatório.','error'); return }
    try {
      if (form.id) await PUT(`/obras/${form.id}`, form)
      else await POST('/obras', form)
      addToast(form.id?'Obra atualizada!':'Obra criada!','success'); fechar(); load()
    } catch(e) { addToast(e.message,'error') }
  }
  const desativar = async () => {
    try { await DEL(`/obras/${form.id}`); addToast('Obra desativada.','success'); fechar(); load() }
    catch(e) { addToast(e.message,'error') }
  }
  const painel = () => {
    const footer = confirmDel ? (
      <div style={{display:'flex',alignItems:'center',gap:10,width:'100%',justifyContent:'space-between',flexWrap:'wrap'}}>
        <span style={{fontSize:'.85rem',color:'var(--danger)',fontWeight:600,display:'inline-flex',alignItems:'center',gap:6}}><Icon name="alertTriangle" size={15}/> Desativar esta obra? O histórico de cautelas é preservado.</span>
        <div className="gap-8"><button className="btn btn-ghost btn-sm" onClick={()=>setConfirmDel(false)}>Não</button><button className="btn btn-danger btn-sm" onClick={desativar}>Sim, desativar</button></div>
      </div>
    ) : (<>
      <div>{form.id && !!form.ativo && <button className="btn btn-danger btn-sm" onClick={()=>setConfirmDel(true)}><Icon name="trash" size={14}/> Desativar</button>}</div>
      <div className="gap-8">
        <button className="btn btn-ghost btn-sm" onClick={fechar}>Cancelar</button>
        <button className="btn btn-primary btn-sm" onClick={save}><Icon name="check" size={14}/> Salvar</button>
      </div>
    </>)
    return (
      <PainelEdicao titulo={form.id ? `Editar ${form.nome}` : 'Nova obra'} onFechar={fechar} footer={footer}>
        <div className="form-grid">
          <div className="form-group"><label>Nome da obra *</label><input value={form.nome||''} onChange={e=>setForm({...form,nome:e.target.value})} placeholder="Ex.: Residencial Vista Mar" /></div>
          <div className="form-group"><label>Código / Contrato</label><input value={form.codigo||''} onChange={e=>setForm({...form,codigo:e.target.value})} placeholder="OBR-01" /></div>
          <div className="form-group"><label>Responsável (engenharia)</label><input value={form.responsavel||''} onChange={e=>setForm({...form,responsavel:e.target.value})} placeholder="Eng. responsável" /></div>
          <div className="form-group"><label>Líder responsável</label>
            <select value={form.lider_id||''} onChange={e=>setForm({...form,lider_id:e.target.value})}>
              <option value="">Sem líder definido</option>
              {lideres.map(l=><option key={l.id} value={l.id}>{l.nome}</option>)}
            </select>
            <span className="text-muted" style={{fontSize:'.72rem',marginTop:4,display:'block'}}>O líder só enxerga a obra depois de ser definido aqui.</span>
          </div>
          <div className="form-group"><label>Endereço</label><input value={form.endereco||''} onChange={e=>setForm({...form,endereco:e.target.value})} /></div>
          {form.id && <div className="form-group"><label>Status</label>
            <select value={form.ativo?'1':'0'} onChange={e=>setForm({...form,ativo:e.target.value==='1'})}>
              <option value="1">Ativa</option><option value="0">Inativa</option>
            </select>
          </div>}
        </div>
      </PainelEdicao>
    )
  }
  const vazio = <div className="empty"><div className="empty-icon"><Icon name="building" size={32}/></div><p>Nenhuma obra cadastrada.</p><button className="btn btn-accent empty-cta" onClick={abrirNovo}><Icon name="plus" size={14}/> Nova obra</button></div>
  return (
    <div style={{maxWidth:680,margin:'0 auto'}}>
      <div className="topbar"><h2>Obras</h2><button className="btn btn-accent" onClick={abrirNovo}><Icon name="plus" size={14}/> Nova</button></div>
      <div className="card">
        <ListaAcordeao
          itens={lista} keyOf={o=>o.id} abertoId={openId} onToggle={toggle}
          novoAberto={openId==='new'} painelNovo={painel()} painel={()=>painel()} vazio={vazio}
          resumo={o=>({
            titulo: <><span className="nm">{o.nome}</span>{o.codigo && <span className="text-muted" style={{fontSize:'.72rem',marginLeft:6}}>{o.codigo}</span>}{!o.ativo && <span className="badge badge-devolvida" style={{fontSize:'.62rem',padding:'1px 7px',marginLeft:6}}>Inativa</span>}</>,
            direita: o.lider_nome
              ? <span className="badge badge-lider" style={{fontSize:'.68rem'}}>{o.lider_nome}</span>
              : <span style={{fontSize:'.72rem',color:'var(--warning)',display:'inline-flex',alignItems:'center',gap:4,fontWeight:600}}><Icon name="alertTriangle" size={12}/> Sem líder</span>
          })}
        />
      </div>
    </div>
  )
}

// ─── OBRAS (líder) — Kanban: arrasta colaborador da equipe entre as obras dele ─
// Colunas = obras atribuídas ao líder (+ "Sem obra"). Mover entre as próprias obras
// é imediato (POST /equipe/mover). Passar p/ outro líder (com aceite) fica na aba equipe.
function ObrasLiderPage({ user, addToast }) {
  const [obras, setObras] = useState([])
  const [membros, setMembros] = useState([])
  const [loading, setLoading] = useState(true)
  const [dragId, setDragId] = useState(null)
  const [overCol, setOverCol] = useState(undefined)  // obra_id sob o cursor (null = coluna "Sem obra")
  const [busyId, setBusyId] = useState(null)

  const load = () => {
    setLoading(true)
    Promise.all([ GET('/obras'), GET('/equipe') ])
      .then(([o, eq]) => { setObras(o||[]); setMembros((eq&&eq.membros)||[]) })
      .catch(e => addToast(e.message,'error'))
      .finally(()=>setLoading(false))
  }
  useEffect(load, [])

  const colObraIds = new Set(obras.map(o=>o.id))
  // obra "efetiva" do membro: só conta se for uma obra do líder; senão cai em "Sem obra".
  const obraDe = (m) => (m.obra_id && colObraIds.has(m.obra_id)) ? m.obra_id : null
  const colunas = [{ id: null, nome: 'Volantes', semObra: true }, ...obras]
  const membrosDaColuna = (colId) => membros.filter(m => obraDe(m) === (colId || null))

  const mover = async (colaborador_id, obra_id) => {
    const atual = membros.find(m=>m.id===colaborador_id)
    const destino = obra_id || null
    if (obraDe(atual||{}) === destino) return
    setBusyId(colaborador_id)
    try {
      await POST('/equipe/mover', { colaborador_id, obra_id: destino, para_lider_id: null })
      const nome = destino ? ((obras.find(o=>o.id===destino)||{}).nome || 'obra') : 'Volantes'
      setMembros(ms => ms.map(m => m.id===colaborador_id ? {...m, obra_id: destino} : m))
      addToast(`${atual?atual.nome:'Colaborador'} movido para ${nome}.`, 'success')
    } catch(e){ addToast(e.message,'error'); load() }
    finally { setBusyId(null); setDragId(null); setOverCol(undefined) }
  }

  if (loading) return <div style={{padding:24,color:'var(--text-secondary)'}}>Carregando obras…</div>

  return (
    <div>
      <div className="topbar"><h2>Obras</h2></div>
      <p className="text-muted" style={{margin:'-6px 0 14px',fontSize:'.84rem'}}>Suas obras e quem está em cada uma. Arraste o colaborador (ou use o seletor no card) para movê-lo de obra na hora — imediato, dentro da sua equipe.</p>

      {obras.length === 0 ? (
        <div className="card"><div className="empty"><div className="empty-icon"><Icon name="building" size={32}/></div><p>Nenhuma obra atribuída a você ainda.</p><p className="text-muted" style={{fontSize:'.82rem'}}>O Diretor de Operações ou o Almoxarifado define quais obras são suas.</p></div></div>
      ) : (
        <div style={{display:'flex',gap:12,overflowX:'auto',paddingBottom:10,alignItems:'flex-start'}}>
          {colunas.map(col => {
            const ms = membrosDaColuna(col.id)
            const total = ms.reduce((s,m)=>s+(m.valor_em_posse||0),0)
            const over = overCol === (col.id||null)
            return (
              <div key={col.id||'sem'}
                onDragOver={e=>{ e.preventDefault(); setOverCol(col.id||null) }}
                onDragLeave={()=>setOverCol(prev => prev===(col.id||null) ? undefined : prev)}
                onDrop={()=>{ if(dragId!=null) mover(dragId, col.id) }}
                style={{minWidth:222,maxWidth:264,flex:'0 0 auto',background:'var(--card)',border:`1.5px ${over?'dashed':'solid'} ${over?'var(--primary-accent)':'var(--border)'}`,borderRadius:12,padding:11,transition:'border-color .15s'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{width:30,height:30,borderRadius:8,background:col.semObra?'var(--silver)':'var(--primary-light)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name={col.semObra?'users':'building'} size={16}/></span>
                  <div style={{minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:'.9rem',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{col.nome}{col.codigo?<span className="text-muted" style={{fontWeight:400,fontSize:'.72rem',marginLeft:5}}>{col.codigo}</span>:null}</div>
                    <div className="text-muted" style={{fontSize:'.72rem'}}>{ms.length} colab.{total>0?` · ${fmtBRL(total)}`:''}</div>
                  </div>
                </div>
                <div style={{marginTop:9,display:'flex',flexDirection:'column',gap:7,minHeight:44}}>
                  {ms.length===0 && <div className="text-muted" style={{fontSize:'.76rem',textAlign:'center',padding:'14px 4px',border:'1px dashed var(--border)',borderRadius:8}}>{over?'Soltar aqui':'—'}</div>}
                  {ms.map(m => (
                    <div key={m.id} draggable onDragStart={()=>setDragId(m.id)} onDragEnd={()=>{ setDragId(null); setOverCol(undefined) }}
                      style={{background:'#fff',border:'1px solid var(--border)',borderRadius:9,padding:'8px 9px',cursor:'grab',opacity:busyId===m.id?.5:1,boxShadow:dragId===m.id?'0 4px 12px rgba(26,37,53,.18)':'none'}}>
                      <div style={{display:'flex',alignItems:'center',gap:7}}>
                        <span style={{width:24,height:24,borderRadius:'50%',background:'var(--primary-accent)',color:'#fff',fontSize:'.64rem',fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{iniciais(m.nome)}</span>
                        <div style={{minWidth:0,flex:1}}>
                          <div style={{fontWeight:600,fontSize:'.82rem',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{m.nome}</div>
                          <div className="text-muted" style={{fontSize:'.7rem'}}>{m.cautelas_ativas||0} cautela(s) · {fmtBRL(m.valor_em_posse||0)}</div>
                        </div>
                      </div>
                      <select value="" onChange={e=>{ const v=e.target.value; if(v!=='') mover(m.id, v==='__sem'?null:Number(v)) }}
                        style={{marginTop:7,width:'100%',fontSize:'.74rem',padding:'4px 6px'}} disabled={busyId===m.id}>
                        <option value="">Mover para…</option>
                        {obraDe(m)!==null && <option value="__sem">Volantes</option>}
                        {obras.filter(o=>o.id!==obraDe(m)).map(o=><option key={o.id} value={o.id}>{o.nome}</option>)}
                      </select>
                    </div>
                  ))}
                </div>
              </div>
            )
          })}
        </div>
      )}
      <p className="text-muted" style={{fontSize:'.78rem',marginTop:10,display:'inline-flex',alignItems:'center',gap:6,flexWrap:'wrap'}}><Icon name="handshake" size={13}/> Para passar um colaborador a outro líder (com aceite), use a aba <strong style={{margin:'0 3px'}}>Minha equipe</strong>.</p>
    </div>
  )
}

// ─── MINHA EQUIPE (líder) — colaborador volátil + transferência com aceite ─────
function EquipePage({ user, addToast }) {
  const [data, setData] = useState({ membros: [], pendentes_recebimento: [], pendentes_envio: [], total_valor: 0, total_cautelas: 0 })
  const [obras, setObras] = useState([])
  const [lideres, setLideres] = useState([])
  const [openId, setOpenId] = useState(null)
  const [detalhe, setDetalhe] = useState({})
  const [mov, setMov] = useState({ obra_id: '', para_lider_id: '' })
  const [busy, setBusy] = useState(false)

  const load = () => GET('/equipe').then(setData).catch(e=>addToast(e.message,'error'))
  useEffect(() => {
    load()
    GET('/obras').then(setObras).catch(()=>{})
    GET('/usuarios/lideres').then(setLideres).catch(()=>{})
  }, [])

  const lideresDisp = lideres.filter(l => l.id !== user.id)

  const toggle = (m) => {
    if (openId === m.id) { setOpenId(null); return }
    setOpenId(m.id)
    setMov({ obra_id: m.obra_id || '', para_lider_id: '' })
    if (!detalhe[m.id]) GET(`/equipe/${m.id}/cautelas`).then(cs => setDetalhe(d => ({...d, [m.id]: cs}))).catch(()=>{})
  }

  const mover = async (m) => {
    setBusy(true)
    try {
      const r = await POST('/equipe/mover', { colaborador_id: m.id, obra_id: mov.obra_id || null, para_lider_id: mov.para_lider_id || null })
      if (r.pendente) addToast(`Transferência enviada — aguardando ${r.para_lider_nome} confirmar o recebimento.`, 'warning')
      else addToast('Colaborador movido de obra.', 'success')
      setOpenId(null); load()
    } catch(e) { addToast(e.message,'error') } finally { setBusy(false) }
  }

  const responder = async (t, acao) => {
    try {
      await POST(`/equipe/transferencias/${t.id}/${acao}`)
      addToast(acao==='aceitar' ? `${t.colaborador_nome} entrou na sua equipe.` : 'Transferência recusada.', acao==='aceitar'?'success':'warning')
      load()
    } catch(e) { addToast(e.message,'error') }
  }
  const cancelarEnvio = async (t) => {
    try { await POST(`/equipe/transferencias/${t.id}/cancelar`); addToast('Transferência cancelada.','warning'); load() }
    catch(e){ addToast(e.message,'error') }
  }

  return (
    <div style={{maxWidth:760,margin:'0 auto'}}>
      <div className="topbar"><h2>Minha equipe</h2></div>
      <p className="text-muted" style={{margin:'-6px 0 14px',fontSize:'.84rem'}}>Gestão à vista da sua equipe — quem está em cada obra e o que cada colaborador tem em campo. O responsável direto por cada ferramenta é o colaborador que a retirou, até a devolução ao almoxarifado.</p>

      <div className="stats-grid" style={{marginBottom:16}}>
        <div className="stat-card blue"><div className="stat-label">Colaboradores</div><div className="stat-value">{data.membros.length}</div></div>
        <div className="stat-card"><div className="stat-label">Cautelas ativas</div><div className="stat-value">{data.total_cautelas}</div></div>
        <div className="stat-card green"><div className="stat-label">Valor em campo</div><div className="stat-value money">{fmtBRL(data.total_valor)}</div></div>
      </div>

      {data.pendentes_recebimento.length > 0 && (
        <div className="card" style={{marginBottom:16,borderLeft:'3px solid #4A90A4'}}>
          <h3 style={{margin:'0 0 6px',display:'flex',alignItems:'center',gap:8,fontSize:'1rem'}}><Icon name="handshake" size={18}/> Recebimentos pendentes</h3>
          {data.pendentes_recebimento.map(t => (
            <div key={t.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap',padding:'10px 0',borderTop:'1px solid var(--border,#eee)'}}>
              <div>
                <strong>{t.colaborador_nome}</strong> <span className="text-muted">— de {t.de_lider_nome||'—'}</span>
                <div className="text-muted" style={{fontSize:'.82rem'}}>
                  {t.posse.cautelas} cautela(s) · {fmtBRL(t.posse.valor)}{t.obra_nome ? ` · vai p/ ${t.obra_nome}` : ''}
                </div>
              </div>
              <div className="gap-8">
                <button className="btn btn-ghost btn-sm" onClick={()=>responder(t,'recusar')}>Recusar</button>
                <button className="btn btn-primary btn-sm" onClick={()=>responder(t,'aceitar')}><Icon name="check" size={14}/> Aceitar</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {data.pendentes_envio.length > 0 && (
        <div className="card" style={{marginBottom:16}}>
          <h4 style={{margin:'0 0 6px',fontSize:'.9rem'}}>Aguardando aceite do outro líder</h4>
          {data.pendentes_envio.map(t => (
            <div key={t.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,fontSize:'.85rem',padding:'5px 0'}}>
              <span>{t.colaborador_nome} → <strong>{t.para_lider_nome}</strong>{t.obra_nome?` (${t.obra_nome})`:''}</span>
              <button className="btn btn-ghost btn-sm" onClick={()=>cancelarEnvio(t)}>Cancelar</button>
            </div>
          ))}
        </div>
      )}

      <div className="card">
        {data.membros.length === 0 ? (
          <div className="empty"><div className="empty-icon"><Icon name="users" size={32}/></div><p>Nenhum colaborador na sua equipe ainda.</p><p className="text-muted" style={{fontSize:'.82rem'}}>Ao entregar uma cautela a um operário, ele entra automaticamente na sua equipe.</p></div>
        ) : data.membros.map(m => (
          <div key={m.id} style={{borderBottom:'1px solid var(--border,#eee)'}}>
            <button onClick={()=>toggle(m)} style={{width:'100%',background:'none',border:'none',cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,padding:'12px 4px',textAlign:'left',color:'inherit'}}>
              <div style={{display:'flex',alignItems:'center',gap:11,minWidth:0}}>
                <span style={{width:36,height:36,borderRadius:'50%',background:'var(--primary-accent)',color:'#fff',fontSize:'.8rem',fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{iniciais(m.nome)}</span>
                <div style={{minWidth:0}}>
                  <div style={{fontWeight:600}}>{m.nome}</div>
                  <div className="text-muted" style={{fontSize:'.8rem',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{m.obra_nome || 'Volante'}{m.cargo?` · ${m.cargo}`:''}</div>
                </div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontWeight:600}}>{fmtBRL(m.valor_em_posse)}</div>
                <div className="text-muted" style={{fontSize:'.78rem'}}>{m.cautelas_ativas} cautela(s)</div>
              </div>
            </button>
            {openId === m.id && (
              <div style={{padding:'2px 8px 16px'}}>
                {(detalhe[m.id]||[]).length > 0 ? (
                  <ul style={{margin:'0 0 12px',paddingLeft:18,fontSize:'.84rem'}}>
                    {detalhe[m.id].map((c,i)=>(<li key={i} style={{marginBottom:3}}><strong>{c.numero}</strong> — {c.itens||'—'} <span className="text-muted">({fmtBRL(c.valor)})</span></li>))}
                  </ul>
                ) : <p className="text-muted" style={{fontSize:'.82rem',margin:'2px 0 12px'}}>Sem ferramentas em posse no momento.</p>}
                <div className="form-grid">
                  <div className="form-group"><label>Mover para obra</label>
                    <select value={mov.obra_id} onChange={e=>setMov({...mov, obra_id:e.target.value})}>
                      <option value="">Volantes</option>
                      {obras.map(o=><option key={o.id} value={o.id}>{o.nome}{o.codigo?` (${o.codigo})`:''}</option>)}
                    </select>
                  </div>
                  <div className="form-group"><label>Passar para outro líder (opcional)</label>
                    <select value={mov.para_lider_id} onChange={e=>setMov({...mov, para_lider_id:e.target.value})}>
                      <option value="">Manter na minha equipe</option>
                      {lideresDisp.map(l=><option key={l.id} value={l.id}>{l.nome}</option>)}
                    </select>
                  </div>
                </div>
                {mov.para_lider_id && <p className="text-muted" style={{fontSize:'.8rem',margin:'6px 0 0',display:'inline-flex',alignItems:'center',gap:6}}><Icon name="alertTriangle" size={13}/> O colaborador só migra quando o líder que recebe confirmar o recebimento.</p>}
                <div style={{marginTop:12,justifyContent:'flex-end',display:'flex',gap:8}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>setOpenId(null)}>Cancelar</button>
                  <button className="btn btn-primary btn-sm" disabled={busy} onClick={()=>mover(m)}><Icon name={mov.para_lider_id?'handshake':'check'} size={14}/> {mov.para_lider_id?'Enviar transferência':'Salvar obra'}</button>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  )
}

// ─── AUDITORIA DA EQUIPE (líder) — histórico só dos colaboradores dele ─────────
function EquipeAuditoriaPage({ addToast }) {
  const [ev, setEv] = useState(null)
  useEffect(()=>{ GET('/equipe/auditoria').then(setEv).catch(e=>{ addToast(e.message,'error'); setEv([]) }) }, [])
  const icone = t => t==='recebeu' ? 'package' : t==='devolveu' ? 'undo' : t==='transferencia' ? 'handshake' : 'history'
  const cor   = t => t==='recebeu' ? '#A07C4E' : t==='devolveu' ? '#4A90A4' : '#6b7280'
  return (
    <div style={{maxWidth:760,margin:'0 auto'}}>
      <div className="topbar"><h2>Auditoria da equipe</h2></div>
      <p className="text-muted" style={{margin:'-6px 0 14px',fontSize:'.84rem'}}>Histórico de retiradas, devoluções e transferências dos colaboradores da sua equipe.</p>
      <div className="card">
        {ev===null ? <p className="text-muted" style={{padding:12}}>Carregando…</p> :
         ev.length===0 ? <div className="empty"><div className="empty-icon"><Icon name="history" size={32}/></div><p>Sem movimentações registradas ainda.</p></div> :
         ev.map((e,i)=>(
          <div key={i} style={{display:'flex',gap:12,alignItems:'flex-start',padding:'10px 2px',borderBottom:'1px solid var(--border,#eee)'}}>
            <span style={{marginTop:2,color:cor(e.tipo),flexShrink:0}}><Icon name={icone(e.tipo)} size={16}/></span>
            <div style={{flex:1}}>
              <div style={{fontSize:'.88rem'}}><strong>{e.colaborador_nome}</strong> {e.descricao}{e.ref?` · ${e.ref}`:''}</div>
              <div className="text-muted" style={{fontSize:'.76rem'}}>{(e.data||'').slice(0,16)}{e.valor?` · ${fmtBRL(e.valor)}`:''}</div>
            </div>
          </div>
         ))}
      </div>
    </div>
  )
}

// ─── USUÁRIOS ─────────────────────────────────────────────────────────────────
function UsuariosPage({ user, addToast }) {
  const [lista, setLista] = useState([])
  const [obras, setObras] = useState([])
  const [lideres, setLideres] = useState([])
  const [openId, setOpenId] = useState(null)
  const [form, setForm] = useState({})
  const [filtroRole, setFiltroRole] = useState('')
  const [confirmDel, setConfirmDel] = useState(false)
  // Perfis que este usuário pode criar/gerenciar (espelha a hierarquia do backend).
  // Diretor: só um nível abaixo (Gerente/líder/operário). Almox/master: todos.
  const perfisDisp = user.role === 'diretor'
    ? [{ v:'gerente', l:'Gerente de Contrato' }, { v:'engenheiro', l:'Engenheiro' }, { v:'lider', l:'Líder' }, { v:'operario', l:'Operário' }]
    : [{ v:'administracao', l:'Administração' }, { v:'compras', l:'Compras' }, { v:'diretor', l:'Diretor de Operações' }, { v:'gerente', l:'Gerente de Contrato' }, { v:'engenheiro', l:'Engenheiro' }, { v:'lider', l:'Líder' }, { v:'operario', l:'Operário' }]
  const load = () => GET('/usuarios').then(setLista)
  useEffect(() => { load(); GET('/obras').then(setObras).catch(()=>{}); GET('/usuarios/lideres').then(setLideres).catch(()=>{}) }, [])
  const abrirNovo = () => { setForm({role:'operario',ativo:true}); setConfirmDel(false); setOpenId('new') }
  const toggle = u => {
    if (openId === u.id) { fechar(); return }
    setForm({...u, senha:''}); setConfirmDel(false); setOpenId(u.id)
  }
  const fechar = () => { setOpenId(null); setConfirmDel(false) }
  const save = async () => {
    if (!form.nome || !form.email) { addToast('Nome e email obrigatórios.','error'); return }
    if (!form.id && !form.senha) { addToast('Informe a senha.','error'); return }
    try {
      if (form.id) await PUT(`/usuarios/${form.id}`, form)
      else await POST('/usuarios', form)
      addToast(form.id?'Atualizado!':'Criado!','success'); fechar(); load()
    } catch(e) { addToast(e.message,'error') }
  }
  const del = async () => {
    try { await DEL(`/usuarios/${form.id}`); addToast('Usuário excluído.','success'); fechar(); load() }
    catch(e) { addToast(e.message,'error') }
  }
  const filtrados = lista.filter(u => !filtroRole || u.role === filtroRole)
  const painel = () => {
    const footer = confirmDel ? (
      <div style={{display:'flex',alignItems:'center',gap:10,width:'100%',justifyContent:'space-between',flexWrap:'wrap'}}>
        <span style={{fontSize:'.85rem',color:'var(--danger)',fontWeight:600,display:'inline-flex',alignItems:'center',gap:6}}><Icon name="alertTriangle" size={15}/> Excluir este usuário? Não pode ser desfeito.</span>
        <div className="gap-8"><button className="btn btn-ghost btn-sm" onClick={()=>setConfirmDel(false)}>Não</button><button className="btn btn-danger btn-sm" onClick={del}>Sim, excluir</button></div>
      </div>
    ) : (<>
      <div>{form.id && form.role !== 'almoxarifado' && <button className="btn btn-danger btn-sm" onClick={()=>setConfirmDel(true)}><Icon name="trash" size={14}/> Excluir</button>}</div>
      <div className="gap-8">
        <button className="btn btn-ghost btn-sm" onClick={fechar}>Cancelar</button>
        <button className="btn btn-primary btn-sm" onClick={save}><Icon name="check" size={14}/> Salvar</button>
      </div>
    </>)
    return (
      <PainelEdicao titulo={form.id ? 'Editar usuário' : 'Novo usuário'} onFechar={fechar} footer={footer}>
        <div className="form-grid">
          <div className="form-group"><label>Nome *</label><input value={form.nome||''} onChange={e=>setForm({...form,nome:e.target.value})} /></div>
          <div className="form-group"><label>Email *</label><input type="email" value={form.email||''} onChange={e=>setForm({...form,email:e.target.value})} disabled={!!form.id} /></div>
          <div className="form-group"><label>Cargo</label><input value={form.cargo||''} onChange={e=>setForm({...form,cargo:e.target.value})} placeholder="Pedreiro, Eletricista..." /></div>
          <div className="form-group"><label>Perfil</label>
            <select value={form.role||'operario'} onChange={e=>setForm({...form,role:e.target.value})} disabled={!!form.id}>
              {perfisDisp.map(p=><option key={p.v} value={p.v}>{p.l}</option>)}
            </select>
          </div>
          {obras.length > 0 && (form.role==='lider'||form.role==='operario'||form.role==='engenheiro') && (
            <div className="form-group"><label>Obra padrão</label>
              <select value={form.obra_id||''} onChange={e=>setForm({...form,obra_id:e.target.value})}>
                <option value="">Sem obra fixa</option>
                {obras.map(o=><option key={o.id} value={o.id}>{o.nome}{o.codigo?` (${o.codigo})`:''}</option>)}
              </select>
            </div>
          )}
          {form.role==='operario' && (
            <div className="form-group"><label>Líder responsável</label>
              <select value={form.lider_id||''} onChange={e=>setForm({...form,lider_id:e.target.value})}>
                <option value="">Sem líder definido</option>
                {lideres.map(l=><option key={l.id} value={l.id}>{l.nome}</option>)}
              </select>
            </div>
          )}
          <div className="form-group"><label>{form.id?'Nova senha (em branco = não altera)':'Senha *'}</label><input type="password" value={form.senha||''} onChange={e=>setForm({...form,senha:e.target.value})} placeholder="••••••••" /></div>
          {form.id && <div className="form-group"><label>Status</label>
            <select value={form.ativo?'1':'0'} onChange={e=>setForm({...form,ativo:e.target.value==='1'})}>
              <option value="1">Ativo</option><option value="0">Inativo</option>
            </select>
          </div>}
          <div className="form-group"><label>CPF / CNPJ</label><input value={form.cpf_cnpj||''} onChange={e=>setForm({...form,cpf_cnpj:e.target.value})} placeholder="000.000.000-00" /></div>
          <div className="form-group"><label>Empresa (razão social)</label><input value={form.empresa||''} onChange={e=>setForm({...form,empresa:e.target.value})} /></div>
          <div className="form-group"><label>Telefone</label><input value={form.telefone||''} onChange={e=>setForm({...form,telefone:e.target.value})} placeholder="(21) 99999-9999" /></div>
          <div className="form-group"><label>Endereço</label><input value={form.endereco||''} onChange={e=>setForm({...form,endereco:e.target.value})} /></div>
        </div>
      </PainelEdicao>
    )
  }
  const vazio = <div className="empty"><div className="empty-icon"><Icon name="worker" size={32}/></div><p>{filtroRole ? 'Nenhum usuário com esse perfil.' : 'Nenhum usuário cadastrado.'}</p>{!filtroRole && <button className="btn btn-accent empty-cta" onClick={abrirNovo}><Icon name="plus" size={14}/> Novo usuário</button>}</div>
  return (
    <div style={{maxWidth:680,margin:'0 auto'}}>
      <div className="topbar"><h2>Usuários</h2><button className="btn btn-accent" onClick={abrirNovo}><Icon name="plus" size={14}/> Novo</button></div>
      <div className="card">
        <div className="card-body" style={{paddingBottom:12}}>
          <select value={filtroRole} onChange={e=>setFiltroRole(e.target.value)} style={{width:'auto'}}>
            <option value="">Todos os perfis</option>
            {perfisDisp.map(p=><option key={p.v} value={p.v}>{p.l}</option>)}
          </select>
        </div>
        <ListaAcordeao
          itens={filtrados} keyOf={u=>u.id} abertoId={openId} onToggle={toggle}
          novoAberto={openId==='new'} painelNovo={painel()} painel={()=>painel()} vazio={vazio}
          resumo={u=>({
            titulo: <><span className="nm">{u.nome}</span>{!u.ativo && <span className="badge badge-devolvida" style={{fontSize:'.62rem',padding:'1px 7px'}}>Inativo</span>}</>,
            direita: <span className={`badge badge-${u.role}`}>{ROLE_LABEL[u.role]}</span>
          })}
        />
      </div>
    </div>
  )
}

// ─── AUDITORIA ────────────────────────────────────────────────────────────────
function AuditoriaPage({ user, addToast }) {
  const isMaster = !!(user && user.is_master)
  const [logs, setLogs] = useState([])
  const [busca, setBusca] = useState('')
  const [resetModal, setResetModal] = useState(false)
  const [resetConfirm, setResetConfirm] = useState('')
  const [resetSenha, setResetSenha] = useState('')
  const [resetLoading, setResetLoading] = useState(false)
  const [resetErr, setResetErr] = useState('')
  const [zerarQtdModal, setZerarQtdModal] = useState(false)
  const [zerarQtdLoading, setZerarQtdLoading] = useState(false)
  const [zerarQtdErr, setZerarQtdErr] = useState('')
  useEffect(() => { GET('/auditoria').then(setLogs) }, [])
  const ACAO_ICON = { LOGIN:'key', CRIAR_SOLICITACAO:'clipboard', SOLICITACAO_SEPARANDO:'package', SOLICITACAO_PRONTA:'checkCircle', CANCELAR_SOLICITACAO:'x', RETIRADA_CAUTELA:'signature', DEVOLVER_CAUTELA:'download', ENTREGA_OPERARIO:'send', DEVOLUCAO_ENTREGA:'download', SOLICITAR_EMPRESTIMO:'handshake', CONFIRMAR_EMPRESTIMO:'checkCircle', RECUSAR_EMPRESTIMO:'x', AVAL_LIDER_EMPRESTIMO:'signature', DEVOLVER_EMPRESTIMO:'download', CRIAR_FERRAMENTA:'wrench', EDITAR_FERRAMENTA:'edit', EXCLUIR_FERRAMENTA:'trash', CRIAR_USUARIO:'worker', EDITAR_USUARIO:'edit', CRIAR_BOLSA:'backpack', EDITAR_BOLSA:'edit', VER_TERMO:'fileText', RESET_TRANSACIONAL:'alertTriangle' }
  const filtrados = logs.filter(l => !busca || (l.usuario_nome||'').toLowerCase().includes(busca.toLowerCase()) || l.acao.toLowerCase().includes(busca.toLowerCase()))

  async function zerarQuantidades() {
    setZerarQtdLoading(true); setZerarQtdErr('')
    try {
      const r = await POST('/admin/zerar-quantidades', {})
      setZerarQtdModal(false)
      addToast(`Quantidades zeradas em ${r.alteradas} ferramenta(s). Atualize o estoque real.`, 'success')
    } catch(e) { setZerarQtdErr(e.message) }
    finally { setZerarQtdLoading(false) }
  }

  async function executarReset() {
    if (resetConfirm !== 'CONFIRMAR RESET') { setResetErr('Digite exatamente: CONFIRMAR RESET'); return }
    if (!resetSenha) { setResetErr('Informe a senha do gestor'); return }
    setResetLoading(true); setResetErr('')
    try {
      await POST('/admin/reset-transacional', { confirmacao: resetConfirm, senha_gestor: resetSenha })
      setResetModal(false); setResetConfirm(''); setResetSenha(''); setLogs([])
      addToast('Sistema zerado com sucesso. Pronto para uso real.', 'success')
    } catch(e) {
      setResetErr(e.message)
    } finally {
      setResetLoading(false)
    }
  }

  return (
    <div>
      <div className="topbar">
        <h2>Auditoria</h2>
        {isMaster && (<div className="topbar-actions">
          <button className="btn btn-ghost btn-sm" onClick={async ()=>{
            try {
              const res = await fetch('/api/admin/backup', { headers: { Authorization: `Bearer ${token.value}` } })
              if (!res.ok) { const d = await res.json(); alert(d.error || 'Erro ao baixar backup'); return }
              const blob = await res.blob()
              const url = URL.createObjectURL(blob)
              const a = document.createElement('a')
              a.href = url
              a.download = `cautela-backup-${new Date().toISOString().slice(0,10)}.db`
              a.click(); URL.revokeObjectURL(url)
            } catch(e) { alert('Erro: ' + e.message) }
          }} style={{display:'inline-flex',alignItems:'center',gap:6}}><Icon name="download" size={14}/> Baixar Backup</button>
          <button className="btn btn-ghost btn-sm" style={{borderColor:'var(--warning)',color:'var(--warning)',display:'inline-flex',alignItems:'center',gap:6}} onClick={()=>{setZerarQtdModal(true);setZerarQtdSenha('');setZerarQtdErr('')}}><Icon name="package" size={14}/> Zerar Quantidades</button>
          <button className="btn btn-danger btn-sm" onClick={()=>{setResetModal(true);setResetConfirm('');setResetErr('')}} style={{display:'inline-flex',alignItems:'center',gap:6}}><Icon name="alertTriangle" size={14}/> Zerar Dados de Teste</button>
        </div>)}
      </div>

      {zerarQtdModal && (
        <div className="modal-overlay open">
          <div className="modal modal-sm">
            <div className="modal-header"><h3 style={{display:'flex',alignItems:'center',gap:8}}><Icon name="package" size={17}/> Zerar Quantidades</h3><button className="modal-close" onClick={()=>setZerarQtdModal(false)}>×</button></div>
            <div className="modal-body">
              <div className="alert alert-warning" style={{marginBottom:16}}>
                Vai setar <strong>quantidade = 0</strong> em todas as ferramentas <strong>sem código de patrimônio</strong>.<br/>
                Ferramentas patrimoniais (<Icon name="lock" size={11}/>) não serão afetadas.<br/>
                Após isso, edite cada ferramenta com o estoque real.
              </div>
              {zerarQtdErr && <div className="alert alert-error" style={{marginTop:10}}>{zerarQtdErr}</div>}
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setZerarQtdModal(false)}>Cancelar</button>
              <button className="btn btn-danger" onClick={zerarQuantidades} disabled={zerarQtdLoading}>{zerarQtdLoading?'Zerando...':<span style={{display:'inline-flex',alignItems:'center',gap:6}}><Icon name="package" size={14}/> Confirmar</span>}</button>
            </div>
          </div>
        </div>
      )}

      {resetModal && (
        <div className="modal-overlay open">
          <div className="modal modal-sm">
            <div className="modal-header"><h3 style={{display:'flex',alignItems:'center',gap:8}}><Icon name="alertTriangle" size={17}/> Zerar Dados Transacionais</h3><button className="modal-close" onClick={()=>{setResetModal(false);setResetSenha('');setResetConfirm('')}}>×</button></div>
            <div className="modal-body">
              <div className="alert alert-error" style={{marginBottom:16}}>
                <strong>Ação irreversível.</strong> Serão apagados permanentemente:<br/>
                Todas as solicitações, cautelas, empréstimos e auditoria.<br/>
                <strong>Ferramentas e usuários serão mantidos.</strong>
              </div>
              <div className="form-group" style={{marginBottom:14}}>
                <label>Senha do Gestor</label>
                <input type="password" value={resetSenha} onChange={e=>setResetSenha(e.target.value)} placeholder="Senha exclusiva do gestor" />
              </div>
              <div className="form-group">
                <label>Digite exatamente para confirmar:</label>
                <p style={{fontFamily:'monospace',fontWeight:700,margin:'4px 0 8px',fontSize:'1rem',color:'var(--danger)'}}>CONFIRMAR RESET</p>
                <input value={resetConfirm} onChange={e=>setResetConfirm(e.target.value)} placeholder="CONFIRMAR RESET" />
              </div>
              {resetErr && <div className="alert alert-error" style={{marginTop:10}}>{resetErr}</div>}
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setResetModal(false)}>Cancelar</button>
              <button className="btn btn-danger" onClick={executarReset} disabled={resetLoading}>{resetLoading?'Zerando...':<span style={{display:'inline-flex',alignItems:'center',gap:6}}><Icon name="alertTriangle" size={14}/> Confirmar Reset</span>}</button>
            </div>
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-body" style={{paddingBottom:0}}>
          <input placeholder="Buscar..." value={busca} onChange={e=>setBusca(e.target.value)} style={{maxWidth:340,marginBottom:16}} />
        </div>
        <div className="table-wrap"><table className="cards-mobile">
          <thead><tr><th>Data/Hora</th><th>Usuário</th><th>Ação</th><th>Detalhe</th></tr></thead>
          <tbody>
            {filtrados.map(l=>(
              <tr key={l.id}>
                <td className="text-muted" data-label="Data/Hora" style={{fontSize:'.8rem',whiteSpace:'nowrap'}}>{(l.criado_em||'').replace('T',' ').slice(0,16)}</td>
                <td data-label="Usuário">{l.usuario_nome||'—'}{l.usuario_role&&<><br/><span className={`badge badge-${l.usuario_role}`} style={{fontSize:'.7rem'}}>{ROLE_LABEL[l.usuario_role]}</span></>}</td>
                <td data-label="Ação"><span style={{marginRight:6,display:'inline-flex',verticalAlign:'middle',color:'var(--text-secondary)'}}>{ACAO_ICON[l.acao] ? <Icon name={ACAO_ICON[l.acao]} size={14}/> : <Icon name="fileText" size={14}/>}</span>{l.acao}</td>
                <td className="text-muted" data-label="Detalhe" style={{fontSize:'.82rem',maxWidth:220}}>{l.detalhe ? (typeof l.detalhe==='string'&&l.detalhe.startsWith('{') ? JSON.stringify(JSON.parse(l.detalhe),null,0).slice(0,80) : l.detalhe) : '—'}</td>
              </tr>
            ))}
            {!filtrados.length && <tr><td colSpan="4"><div className="empty"><div className="empty-icon"><Icon name="history" size={32}/></div><p>Sem registros.</p></div></td></tr>}
          </tbody>
        </table></div>
      </div>
    </div>
  )
}

function Icon({ name, size=20 }) {
  const path = ICON_PATHS[name]
  if (!path) return null
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>
      {path}
    </svg>
  )
}

// ─── SIDEBAR ──────────────────────────────────────────────────────────────────
function Sidebar({ user, page, navigate, onLogout, notif }) {
  const alm = user.role === 'almoxarifado'
  const lider = user.role === 'lider'
  const eng = user.role === 'engenheiro'
  const op = user.role === 'operario'
  const diretor = user.role === 'diretor'
  const gerente = user.role === 'gerente'
  const unif = PERFIS_UNIFORME.includes(user.role)
  const items = [
    { id: 'dashboard', icon: 'dashboard', label: 'Painel', show: true },
    { id: 'solicitacoes', icon: 'clipboard', label: 'Solicitações', show: alm || lider || eng, badge: alm ? ((notif.solicitacoes_novas||0)+(notif.solicitacoes_prontas||0)) : (notif.sol_prontas||0) },
    { id: 'nova-solicitacao', icon: 'plus', label: 'Nova Solicitação', show: lider || eng },
    { id: 'equipe', icon: 'users', label: 'Minha equipe', show: lider || eng, badge: notif.transferencias_recebidas||0 },
    { id: 'obras', icon: 'building', label: 'Obras', show: alm || diretor || gerente || eng },
    { id: 'cautelas', icon: 'package', label: 'Cautelas', show: alm || lider || eng || op },
    { id: 'emprestimos', icon: 'exchange', label: 'Empréstimos', show: alm || lider || eng || op, badge: op?(notif.emprestimos_aguardando_confirmacao||0):((lider||eng)?(notif.emprestimos_aguardando_aval||0):0) },
    { id: 'uniformes', icon: 'shirt', label: 'Uniformes / EPI', show: unif, badge: (notif.uniforme_estoque_minimo||0)+(notif.uniforme_desgaste||0) },
    { id: 'ferramentas', icon: 'wrench', label: 'Ferramentas', show: alm },
    { id: 'bolsas', icon: 'backpack', label: 'Bolsas / Kits', show: alm },
    { id: 'usuarios', icon: 'users', label: 'Usuários', show: alm || diretor },
    // Auditoria fica sempre por último, após Empréstimos (regra de layout do sidebar).
    { id: 'equipe-auditoria', icon: 'history', label: 'Auditoria', show: lider || eng },
    { id: 'auditoria', icon: 'history', label: 'Auditoria', show: alm },
  ].filter(i => i.show)
  return (
    <div className="sidebar">
      <div className="sidebar-header">
        <div className="sidebar-logo">
          {empresaInfo.logoUrl && <img src={empresaInfo.logoUrl} alt={empresaInfo.nome} style={{maxWidth:36,maxHeight:36,borderRadius:6}} />}
          <div><h2>Cautelix</h2><p>{empresaInfo.nome}</p></div>
        </div>
      </div>
      <div className="sidebar-user">
        <div className="name">{user.nome}</div>
        <div className="role">{user.is_master ? 'Administrador Master' : (ROLE_LABEL[user.role] + ((user.cargo && user.cargo.trim().toLowerCase() !== ROLE_LABEL[user.role].toLowerCase()) ? ` — ${user.cargo}` : ''))}</div>
        <div style={{fontSize:'.7rem',color:'rgba(255,255,255,.45)',marginTop:4,wordBreak:'break-all'}}>{user.email}</div>
      </div>
      <nav className="sidebar-nav">
        {items.map(item=>(
          <button key={item.id} className={`nav-item ${page===item.id?'active':''}`} onClick={()=>navigate(item.id)}>
            <span className="nav-icon"><Icon name={item.icon} size={18}/></span>
            {item.label}
            {item.badge > 0 && <span className="nav-badge">{item.badge}</span>}
          </button>
        ))}
      </nav>
      <div className="sidebar-footer"><button className="btn-logout" onClick={onLogout}><Icon name="logout" size={16}/> Sair</button></div>
    </div>
  )
}

// ─── BOTTOM NAV ───────────────────────────────────────────────────────────────
function BottomNav({ user, page, navigate, notif }) {
  const alm = user.role === 'almoxarifado'
  const lider = user.role === 'lider'
  const eng = user.role === 'engenheiro'
  const op = user.role === 'operario'
  const diretor = user.role === 'diretor'
  const gerente = user.role === 'gerente'
  const unif = PERFIS_UNIFORME.includes(user.role)
  const items = [
    { id: 'dashboard', icon: 'dashboard', label: 'Painel' },
    { id: 'solicitacoes', icon: 'clipboard', label: alm?'Fila':'Pedidos', badge: alm?((notif.solicitacoes_novas||0)+(notif.solicitacoes_prontas||0)):(notif.sol_prontas||0), show: alm||lider||eng },
    { id: 'equipe', icon: 'users', label: 'Equipe', show: lider||eng, badge: notif.transferencias_recebidas||0 },
    { id: 'obras', icon: 'building', label: 'Obras', show: diretor||gerente||eng },
    { id: 'cautelas', icon: 'package', label: 'Cautelas', show: alm||lider||eng||op },
    { id: 'uniformes', icon: 'shirt', label: 'Uniformes', show: unif, badge: (notif.uniforme_estoque_minimo||0)+(notif.uniforme_desgaste||0) },
    { id: 'emprestimos', icon: 'exchange', label: 'Empréstimos', show: alm||lider||eng||op, badge: op?(notif.emprestimos_aguardando_confirmacao||0):((lider||eng)?(notif.emprestimos_aguardando_aval||0):0) },
    { id: 'ferramentas', icon: 'wrench', label: 'Ferramentas', show: alm },
  ].filter(i => i.show !== false).slice(0,5)
  return (
    <nav className="bottom-nav">
      <div className="bottom-nav-inner">
        {items.map(item=>(
          <button key={item.id} className={`bottom-nav-btn ${page===item.id?'active':''}`} onClick={()=>navigate(item.id)}>
            <span className="bn-icon"><Icon name={item.icon} size={20}/></span>
            <span className="bn-label">{item.label}</span>
            {item.badge > 0 && <span className="bn-badge">{item.badge}</span>}
          </button>
        ))}
      </div>
    </nav>
  )
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null)
  const [page, setPage] = useState('dashboard')
  const [toasts, setToasts] = useState([])
  const [checking, setChecking] = useState(true)
  const [notif, setNotif] = useState({})

  const addToast = useCallback((msg, type='success') => {
    const id = Date.now()
    setToasts(t => [...t, {id, msg, type}])
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500)
  }, [])

  useEffect(() => {
    if (token.value) {
      GET('/auth/me').then(u => { setUser(u); setChecking(false) })
        .catch(() => { token.value = null; localStorage.removeItem('cf_token'); setChecking(false) })
    } else setChecking(false)
  }, [])

  useEffect(() => {
    if (!user) return
    let prev = {}
    const load = () => GET('/notificacoes').then(n => {
      // Toast para líder quando solicitação fica pronta
      if (user.role === 'lider' || user.role === 'engenheiro') {
        const curr = n.sol_prontas || 0
        const ante = prev.sol_prontas || 0
        if (curr > 0 && curr !== ante) addToast(`${curr} solicitação(ões) pronta(s) para retirada!`, 'warning')
        const tCurr = n.transferencias_recebidas || 0, tAnte = prev.transferencias_recebidas || 0
        if (tCurr > tAnte) addToast(`Você recebeu ${tCurr} pedido(s) de transferência de colaborador — confirme na aba Minha equipe`, 'warning')
      }
      // Toast para operário quando tem empréstimo aguardando confirmação
      if (user.role === 'operario') {
        const curr = n.emprestimos_aguardando_confirmacao || 0
        const ante = prev.emprestimos_aguardando_confirmacao || 0
        if (curr > ante) addToast(`Você tem ${curr} empréstimo(s) aguardando sua confirmação`, 'warning')
      }
      // Alertas do módulo Uniformes — para os 3 perfis com acesso
      if (PERFIS_UNIFORME.includes(user.role)) {
        const minCurr = n.uniforme_estoque_minimo || 0, minAnte = prev.uniforme_estoque_minimo || 0
        if (minCurr > minAnte) addToast(`${minCurr} item(ns) de uniforme/EPI no estoque mínimo`, 'warning')
        const desgCurr = n.uniforme_desgaste || 0, desgAnte = prev.uniforme_desgaste || 0
        if (desgCurr > desgAnte) addToast(`${desgCurr} uniforme(s) com desgaste vencendo — repor`, 'warning')
      }
      prev = n
      setNotif(n)
    }).catch(()=>{})
    load()
    const interval = setInterval(load, 30000)
    return () => clearInterval(interval)
  }, [user])

  const navigate = p => setPage(p)
  const logout = () => { token.value = null; localStorage.removeItem('cf_token'); setUser(null); setPage('dashboard') }

  if (checking) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',fontSize:'1.2rem',color:'#6b7280'}}>Carregando...</div>
  if (!user) return <LoginPage onLogin={u=>{ setUser(u); setPage('dashboard') }} />
  if (user.primeiro_acesso) return <PrimeiroAcessoPage user={user} onConcluido={u=>setUser(u)} />

  const props = { user, navigate, addToast }
  const renderPage = () => {
    if (page === 'dashboard') return <Dashboard {...props} />
    if (page === 'solicitacoes') return <SolicitacoesPage {...props} />
    if (page === 'nova-solicitacao') return <NovaSolicitacaoPage {...props} />
    if (page === 'equipe') return <EquipePage {...props} />
    if (page === 'equipe-auditoria') return <EquipeAuditoriaPage {...props} />
    if (page === 'cautelas') return <CautelasPage {...props} />
    if (page === 'emprestimos') return <EmprestimosPage {...props} />
    if (page === 'uniformes') return <UniformesPage {...props} />
    if (page === 'ferramentas') return <FerramentasPage {...props} />
    if (page === 'obras') return user.role === 'engenheiro' ? <ObrasLiderPage {...props} /> : <ObrasPage {...props} />
    if (page === 'bolsas') return <BolsasPage {...props} />
    if (page === 'usuarios') return <UsuariosPage {...props} />
    if (page === 'auditoria') return <AuditoriaPage {...props} />
    return <div style={{padding:24}}>Página não encontrada.</div>
  }

  return (
    <div className="layout">
      <Sidebar user={user} page={page} navigate={navigate} onLogout={logout} notif={notif} />
      <div className="main-content">{renderPage()}</div>
      <BottomNav user={user} page={page} navigate={navigate} notif={notif} />
      <Toast toasts={toasts} />
    </div>
  )
}

function startApp() {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />)
}
// Busca o nome real da empresa antes de renderizar (usado em termos legais e avisos);
// se falhar, segue com o valor genérico padrão em vez de travar o carregamento.
fetch('/api/empresa').then(r => r.json()).then(e => {
  if (e && e.nome) empresaInfo.nome = e.nome
  if (e && e.razaoSocial) empresaInfo.razaoSocial = e.razaoSocial
  if (e && e.logoUrl) empresaInfo.logoUrl = e.logoUrl
}).catch(() => {}).finally(startApp)
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(r => console.log('SW:', r.scope))
      .catch(e => console.warn('SW falhou:', e))
  })
}
</script>
</body>
